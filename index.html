function buildInterviewPrep(ctx) {
  const s = db.settings;
  const p = s.experienceProfile;
  const company = ctx.company || '[Company]';
  const role = ctx.jobTitle || '[Job title]';
  const report = ctx.report || null;

  const years = p.totalYears || 5;
  const country = (p.roles && p.roles[0] && p.roles[0].country) || 'Saudi Arabia';
  const systems = p.systems.join(', ') || '[add your systems]';
  const skus = p.skus || '[add your SKU volume]';
  const branches = p.branches || '[add your branch structure]';
  const logistics = p.logistics.join(', ') || '[add your carriers]';
  const processes = listSentence(p.processes);

  const items = [];

  items.push({
    q: 'Walk me through your warehouse and inventory experience.',
    a: 'I have approximately ' + years + ' years in warehouse and inventory operations in ' + country +
       ', working ' + profileSentenceRoles() + '. My work covers ' + processes +
       '. I use ' + systems + ' and handle ' + skus + ' across ' + branches + '.'
  });

  items.push({
    q: 'Which inventory or ERP systems have you used?',
    a: 'I work with ' + systems + '. In practice that means recording receipts, issues and transfers, ' +
       'running stock reports, and tracing discrepancies back to the transaction that caused them.'
  });

  items.push({
    q: 'How do you keep stock accurate?',
    a: 'I rely on routine cycle counting rather than waiting for a problem. I run cycle counts on a fixed ' +
       'schedule and a full monthly stock audit, then reconcile the results against ' + systems +
       '. When the count and the system disagree, I investigate before adjusting the record.'
  });

  items.push({
    q: 'Tell me about a time you found and resolved an inventory discrepancy.',
    a: 'Use a real example you personally handled. A useful structure:\n' +
       '- Situation: which warehouse/branch, what the discrepancy was, and how large it was [ADD REAL DETAILS].\n' +
       '- What you did: the checks you ran (receipts, picking records, transfers between branches, carrier paperwork) [ADD REAL DETAILS].\n' +
       '- Outcome: what caused it, what you corrected, and what you changed to prevent a repeat [ADD REAL DETAILS].\n' +
       'Do not invent figures — use the real ones from your records.'
  });

  items.push({
    q: 'How do you manage receiving, picking, packing and dispatch under time pressure?',
    a: 'My routine is ' + (processes || 'receiving, picking, packing and dispatch') +
       '. I prioritise by dispatch cut-off times, verify quantities at receiving before anything is put away, ' +
       'and keep the system updated as work moves rather than at the end of the shift.'
  });

  if (p.logistics.length) {
    items.push({
      q: 'What experience do you have with couriers and 3PL providers?',
      a: 'I coordinate with ' + logistics + ' for inbound and outbound movements. That includes preparing ' +
         'shipment documentation, tracking collections and deliveries, and raising and following up claims ' +
         'when a shipment is short or damaged.'
    });
  }

  items.push({
    q: 'How do you handle stock across multiple branches?',
    a: 'I work with ' + branches + '. That means tracking transfers between locations, keeping each branch\'s ' +
       'records separate and reconcilable, and running counts per location so a discrepancy can be traced ' +
       'to a specific branch rather than the whole network.'
  });

  items.push({
    q: 'What are FIFO and FEFO, and how do you apply them?',
    a: 'FIFO means first in, first out; FEFO means first expired, first out and is used where stock has a shelf life. ' +
       'In practice I apply them by controlling put-away and picking sequence in the system and on the floor. ' +
       '[ADD: only describe this as your own experience if you have actually done it.]'
  });

  items.push({
    q: 'Why do you want to work in ' + ((s.targetCountries && s.targetCountries[0]) || 'Poland') + '?',
    a: '[ADD YOUR REAL REASON — for example family, a specific career path, or a concrete opportunity you are pursuing.] ' +
       'Do not use a generic answer; interviewers notice.'
  });

  if (p.languages.length) {
    items.push({
      q: 'What is your level in ' + p.languages.join(' / ') + '?',
      a: 'Your profile records: ' + p.languages.join(', ') + '. State exactly that — do not upgrade it under pressure.'
    });
  } else {
    items.push({
      q: 'What is your level of English / Polish?',
      a: 'No language level is recorded in your profile. Do not claim a level you cannot evidence. ' +
         'If you are asked, describe what you can actually do in a work situation and offer to demonstrate it. ' +
         'Add the language to your profile only when you can support the claim.'
    });
  }

  items.push({
    q: 'What are your salary expectations?',
    a: s.salaryAmount
      ? 'My expectation is around ' + s.salaryAmount + ' ' + s.salaryCurrency + ' ' + (s.salaryPeriod || 'month').toLowerCase() +
        ', and I am open to discussing the full package including accommodation and transport.'
      : '[ADD YOUR SALARY EXPECTATION in your profile settings.]'
  });

  items.push({
    q: 'When could you start, and what is your notice period?',
    a: '[ADD YOUR REAL NOTICE PERIOD AND EARLIEST START DATE — including any work-permit processing time.]'
  });

  items.push({
    q: 'Do you have any questions for us?',
    a: 'Ask these, and get the answers in writing where possible:\n' +
       '- Does the role include work-permit support, and who pays the fees?\n' +
       '- Is the contract direct with ' + company + ', or through an agency? If an agency, what is its registration number?\n' +
       '- What are the exact monthly costs for accommodation and transport?\n' +
       '- Are there any recruitment or processing fees at any stage?\n' +
       '- What does the written contract look like, and when is it signed?'
  });

  if (report && report.missing && report.missing.length) {
    const gaps = report.missing.filter(function (m) { return m.severity !== 'info'; });
    if (gaps.length) {
      items.push({
        q: 'How would you address the requirements you do not yet meet?',
        a: 'The job match flagged: ' + gaps.map(function (g) { return g.label; }).join('; ') + '.\n' +
           'Prepare an honest answer for each. Do not claim experience or documents you do not have. ' +
           'Where relevant, say you are willing to complete training and ask whether the employer provides it.'
      });
    }
  }

  const lines = [];
  lines.push('INTERVIEW PREPARATION — ' + role + ' at ' + company);
  lines.push('');
  lines.push('Before the interview');
  lines.push('- Re-read the advert and the job-match report.');
  lines.push('- Confirm the interview format, time zone and who you will speak to.');
  lines.push('- Have your real examples ready. Do not invent numbers, employers or documents.');
  lines.push('');
  lines.push('Questions and prepared answers');
  items.forEach(function (it, i) {
    lines.push('');
    lines.push((i + 1) + '. ' + it.q);
    lines.push(it.a);
  });
  lines.push('');
  lines.push('Remember: every answer here is a starting point. Check every factual claim against your real record.');

  return { subject: 'Interview prep — ' + role + ' at ' + company, body: lines.join('\n') };
}

/* ---------------------------------------------------------
   11. Prompt builders
   --------------------------------------------------------- */
const AI_RULES = [
  'Use ONLY the facts in the CANDIDATE PROFILE. Do not invent employers, dates, job titles, duties, tools, certificates, licences, education, language levels or numeric figures.',
  'If the job requires something the profile does not contain, write a placeholder in square brackets, for example [ADD: forklift licence status]. Never guess or fill the gap with plausible-sounding detail.',
  'Never state a language proficiency level unless it appears in the profile.',
  'Do not exaggerate. No superlatives such as "world-class" or "perfect fit".',
  'Output plain text only — no markdown headings, no bold, no tables.',
  'The human will review and edit every line before use. You are producing a draft, not a final document.'
].join('\n');

function buildAIPrompt(task, ctx) {
  const p = db.settings.experienceProfile;
  const s = db.settings;

  const header = [
    'SYSTEM',
    'You are a writing assistant inside JobTrack, a personal job-application tracker.',
    'Rules you must follow exactly:',
    AI_RULES, '',
    'CANDIDATE PROFILE (the only permitted source of facts)',
    profileJson(p), '',
    'CANDIDATE CONTACT',
    'Name: ' + (s.candidateName || '[not set]'),
    'Email: ' + (s.candidateEmail || '[not set]'),
    'Phone: ' + (s.candidatePhone || '[not set]'),
    'Current location: ' + (s.candidateLocation || '[not set]'),
    'Nationality: ' + (s.nationality || '[not set]'),
    'Target country: ' + ((s.targetCountries && s.targetCountries[0]) || '[not set]'),
    ''
  ].join('\n');

  if (task === 'coverLetter') {
    const r = ctx.report;
    return header + [
      'JOB',
      'Company: ' + (ctx.company || '[not set]'),
      'Job title: ' + (ctx.jobTitle || '[not set]'), '',
      'JOB DESCRIPTION', ctx.jobDescription || '[not provided]', '',
      r ? 'JOB MATCH CONTEXT (computed by JobTrack)' : '',
      r ? 'Score: ' + r.score + '/100 (' + r.bandLabel + ')' : '',
      r ? 'Strong criteria: ' + r.criteria.filter(function (c) { return c.pct >= 0.85; }).map(function (c) { return c.label; }).join(', ') : '',
      r ? 'Missing: ' + (r.missing.map(function (m) { return m.label; }).join('; ') || 'none recorded') : '', '',
      'TASK',
      'Write a cover letter of 250–350 words, addressed to ' + (ctx.recruiterName || 'the hiring manager') + '.',
      'Structure: why this role and company; the candidate\'s relevant experience in their own recorded terms; ' +
      'the systems and scale they have worked with; how their work matches the advert; a factual line about work ' +
      'authorisation if a current location is recorded; a short closing.',
      'Do not add a postal address block. Do not claim anything not in the profile.',
      'End with a signature block using the recorded contact details, or [Your name] if not set.'
    ].filter(Boolean).join('\n');
  }

  if (task === 'recruiterEmail') {
    return header + [
      'JOB',
      'Company: ' + (ctx.company || '[not set]'),
      'Job title: ' + (ctx.jobTitle || '[not set]'),
      'Recruiter: ' + (ctx.recruiterName || '[not named]'),
      'Email purpose: ' + (ctx.subtype || 'enquiry'), '',
      'JOB DESCRIPTION', ctx.jobDescription || '[not provided]', '',
      'TASK',
      'Write a short, professional email (120–180 words) for the purpose above.',
      'Include a subject line on the first line prefixed with "Subject: ".',
      'Where the purpose is an enquiry, ask for written confirmation of work-permit support, ' +
      'direct vs agency employment, accommodation and transport costs, and whether any recruitment fees apply.',
      'Do not claim any qualification, language level or document that is not in the profile.'
    ].join('\n');
  }

  if (task === 'followUp') {
    return header + [
      'JOB',
      'Company: ' + (ctx.company || '[not set]'),
      'Job title: ' + (ctx.jobTitle || '[not set]'),
      'Days since application: ' + (ctx.days || 7), '',
      'TASK',
      'Write a brief follow-up email (80–120 words) with a subject line prefixed with "Subject: ".',
      'Be polite and specific, reference the role and company, restate interest in one sentence, and close.',
      'Do not repeat the whole CV and do not claim anything not in the profile.'
    ].join('\n');
  }

  if (task === 'interviewPrep') {
    const r = ctx.report;
    return header + [
      'JOB',
      'Company: ' + (ctx.company || '[not set]'),
      'Job title: ' + (ctx.jobTitle || '[not set]'), '',
      'JOB DESCRIPTION', ctx.jobDescription || '[not provided]', '',
      r ? 'JOB MATCH CONTEXT' : '',
      r ? 'Score: ' + r.score + '/100' : '',
      r ? 'Missing: ' + (r.missing.map(function (m) { return m.label; }).join('; ') || 'none') : '', '',
      'TASK',
      'Produce 10–14 likely interview questions for this role, each followed by a prepared answer.',
      'Answers must be built only from the candidate profile. Where the profile has no fact for a question, ' +
      'write [ADD: what is needed] instead of inventing an answer.',
      'For behavioural questions, give a STAR structure with placeholders, and say explicitly that the candidate ' +
      'must fill in real details.',
      'Format as plain numbered questions followed by the answer paragraph.'
    ].filter(Boolean).join('\n');
  }

  return header + '\nTASK\n' + (ctx.task || '');
}

/* ---------------------------------------------------------
   12. AI provider call
   --------------------------------------------------------- */
function aiConfigured() {
  const ai = db.settings.ai || {};
  return ai.provider !== 'none' && !!String(ai.model || '').trim() &&
         !!String(ai.baseUrl || '').trim() && !!getAIKey();
}

function getAIKey() {
  const ai = db.settings.ai || {};
  if (runtime.aiKey) return runtime.aiKey;
  if (ai.rememberKey) return String(ai.apiKey || '').trim();
  return '';
}

async function callAI(prompt, opts) {
  opts = opts || {};
  if (!aiConfigured()) throw new Error('AI is not configured.');
  const ai = db.settings.ai;
  const url = String(ai.baseUrl).replace(/\/+$/, '') + '/chat/completions';
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getAIKey() },
      body: JSON.stringify({
        model: ai.model,
        messages: [
          { role: 'system', content: 'You are a careful writing assistant. You never invent facts about the user.' },
          { role: 'user', content: prompt }
        ],
        temperature: 0.3,
        max_tokens: opts.maxTokens || 1400
      })
    });
  } catch (err) {
    throw new Error('Network request failed. The provider may block browser requests (CORS) or you may be offline.');
  }
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 240); } catch (e) { detail = ''; }
    throw new Error('AI request failed (' + res.status + '). ' + detail);
  }
  let data;
  try { data = await res.json(); } catch (e) { throw new Error('The provider returned an unreadable response.'); }
  const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!content) throw new Error('The provider returned an empty response.');
  return String(content).trim();
}

/* ---------------------------------------------------------
   13. Workflow engine
   --------------------------------------------------------- */
function findEmployerForApp(app) {
  if (!app || !app.company) return null;
  const c = String(app.company).toLowerCase().trim();
  if (!c) return null;
  return db.employers.find(function (e) {
    const n = String(e.legalName || '').toLowerCase().trim();
    if (!n) return false;
    return n === c || n.indexOf(c) !== -1 || c.indexOf(n) !== -1;
  }) || null;
}

function latestInterview(app) {
  return db.interviews.filter(function (i) {
    if (i.applicationId === app.id) return true;
    return i.employer && i.jobTitle &&
      i.employer.toLowerCase() === (app.company || '').toLowerCase() &&
      i.jobTitle.toLowerCase() === (app.jobTitle || '').toLowerCase();
  }).sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); })[0] || null;
}

function computeWorkflow(app) {
  if (!app) return [];
  const steps = [];
  const emp = findEmployerForApp(app);
  const intv = latestInterview(app);

  steps.push({ n:1, label:'Job discovered', done:true, detail:'Application record exists in JobTrack.' });

  const hasVacancyDetails = !!(app.jobTitle && app.company && (app.vacancyUrl || (app.city && app.country)));
  steps.push({
    n:2, label:'Vacancy details recorded', done:hasVacancyDetails,
    detail: hasVacancyDetails ? [app.company, app.jobTitle, app.city, app.country].filter(Boolean).join(' · ')
      : 'Add company, job title and a vacancy URL or city/country.',
    actionName: hasVacancyDetails ? '' : 'edit-application'
  });

  const empVerified = isEmployerVerified(emp);
  let empDetail;
  if (!emp) empDetail = 'No matching employer record. Add one and complete the verification checklist.';
  else if (empVerified) empDetail = 'Verified on ' + fmtDate(emp.verificationDate) + ' — evidence recorded.';
  else {
    const missing = verificationRequirements(emp).filter(function (r) { return !r.ok; }).map(function (r) { return r.text; });
    empDetail = 'Status: ' + (emp.verificationStatus || 'Not Checked') + (missing.length ? ' · Missing: ' + missing.join('; ') : '');
  }
  steps.push({ n:3, label:'Employer verified', done:!!empVerified, detail: empDetail,
    actionName: empVerified ? '' : (emp ? 'wf-open-employer' : 'wf-add-employer') });

  const permitChecked = app.workPermitSupport && app.workPermitSupport !== 'Unknown' && !!app.workPermitCheckedAt;
  steps.push({ n:4, label:'Work-permit eligibility checked', done:!!permitChecked,
    detail: permitChecked ? 'Support: ' + app.workPermitSupport + ' · recorded ' + fmtDate(app.workPermitCheckedAt)
      : (app.workPermitSupport && app.workPermitSupport !== 'Unknown'
          ? 'Value is "' + app.workPermitSupport + '" but no check has been recorded.'
          : 'Confirm eligibility and add notes.'),
    actionName: permitChecked ? '' : 'wf-check-permit' });

  const readyDone = !!app.readyToApplyAt || ['Ready to Apply'].concat(SUBMITTED_STATUSES).indexOf(app.status) !== -1;
  steps.push({ n:5, label:'Marked Ready to Apply', done:readyDone,
    detail: readyDone ? (app.readyToApplyAt ? 'Marked on ' + fmtDate(app.readyToApplyAt) : 'Status is ' + app.status)
      : 'Mark the application ready once the employer and eligibility checks are complete.',
    actionName: readyDone ? '' : 'wf-mark-ready' });

  const docsDone = !!(app.cvVersion && app.coverLetterVersion);
  steps.push({ n:6, label:'CV and cover letter selected', done:docsDone,
    detail: docsDone ? 'CV: ' + app.cvVersion + ' · Cover letter: ' + app.coverLetterVersion
      : 'Both a CV version and a cover letter version are required.',
    actionName: docsDone ? '' : 'wf-select-docs' });

  const submittedConfirmed = !!app.submittedConfirmedAt;
  steps.push({ n:7, label:'Application submitted (manual confirmation)', done:submittedConfirmed,
    detail: submittedConfirmed ? 'You confirmed submission on ' + fmtDateTime(app.submittedConfirmedAt)
      : 'JobTrack never submits applications for you. Confirm manually when you have submitted.',
    actionName: submittedConfirmed ? '' : 'wf-confirm-submit' });

  steps.push({ n:8, label:'Submission date recorded', done:!!app.applicationDate,
    detail: app.applicationDate ? 'Submitted ' + fmtDate(app.applicationDate) : 'Set the application date.',
    actionName: app.applicationDate ? '' : 'wf-set-date' });

  const followupScheduled = !!app.followUpDate;
  const followupDiff = app.followUpDate ? daysBetween(todayISO(), app.followUpDate) : 0;
  let followupDetail = 'Not scheduled.';
  if (followupScheduled) {
    if (followupDiff < 0) followupDetail = fmtDate(app.followUpDate) + ' — ' + Math.abs(followupDiff) + ' day(s) overdue';
    else if (followupDiff === 0) followupDetail = fmtDate(app.followUpDate) + ' — due today';
    else followupDetail = fmtDate(app.followUpDate) + ' — in ' + followupDiff + ' day(s)';
  }
  steps.push({ n:9, label:'Follow-up scheduled', done:followupScheduled, detail: followupDetail,
    actionName: followupScheduled ? '' : 'wf-schedule-followup' });

  const responseRecorded = !!((app.responseDetails || '').trim()) || RESPONSE_STATUSES.indexOf(app.status) !== -1;
  steps.push({ n:10, label:'Employer response recorded', done:responseRecorded,
    detail: responseRecorded ? (app.responseDetails || '').trim().slice(0, 140) || ('Status: ' + app.status)
      : 'No response recorded yet.',
    actionName: responseRecorded ? '' : 'wf-record-response' });

  const interviewDone = !!intv || app.status === 'Interview' || app.status === 'Offer Received';
  steps.push({ n:11, label:'Interview scheduled', done:interviewDone,
    detail: intv ? 'Interview ' + fmtDate(intv.date) + (intv.time ? ' at ' + intv.time : '') + ' — ' + (intv.outcome || 'Scheduled')
      : (interviewDone ? 'Status is ' + app.status : 'No interview scheduled.'),
    actionName: interviewDone ? '' : 'wf-add-interview' });

  const offerEvaluated = !!app.offerEvaluatedAt;
  steps.push({ n:12, label:'Offer evaluated', done:offerEvaluated,
    detail: offerEvaluated ? 'Decision: ' + (app.offerDecision || 'Pending') + ' · evaluated ' + fmtDate(app.offerEvaluatedAt)
      : (app.status === 'Offer Received' ? 'An offer is on the table — record your evaluation.' : 'No offer yet.'),
    actionName: (!offerEvaluated && app.status === 'Offer Received') ? 'wf-evaluate-offer' : '' });

  const authVerified = !!app.workAuthVerifiedAt;
  steps.push({ n:13, label:'Work authorization verified', done:authVerified,
    detail: authVerified ? 'Verified ' + fmtDate(app.workAuthVerifiedAt)
      : 'Record verification of your right to work in the target country.',
    actionName: (!authVerified && app.status === 'Offer Received') ? 'wf-verify-auth' : '' });

  const closedStatuses = ['Rejected','Withdrawn','Closed'];
  let step14Done = closedStatuses.indexOf(app.status) !== -1;
  if (app.status === 'Offer Received' && ['Accepted','Declined'].indexOf(app.offerDecision) !== -1 && authVerified) step14Done = true;
  steps.push({ n:14, label:'Application closed or successful', done:step14Done,
    detail: step14Done ? (app.status === 'Offer Received' && app.offerDecision === 'Accepted'
        ? 'Offer accepted · work authorization verified' : 'Final status: ' + app.status)
      : (app.status === 'Offer Received' ? 'Evaluate the offer and verify work authorization to close.'
          : 'Application is still active.'),
    actionName: step14Done ? '' : 'wf-close-app' });

  return steps;
}

function workflowProgress(app) {
  const steps = computeWorkflow(app);
  const done = steps.filter(function (s) { return s.done; }).length;
  return { steps: steps, done: done, total: steps.length };
}

function linkedDrafts(applicationId) {
  return db.aiDrafts.filter(function (d) { return d.applicationId === applicationId && d.status !== 'Discarded'; });
}

function unapprovedDrafts(applicationId) {
  return linkedDrafts(applicationId).filter(function (d) { return d.status === 'Draft'; });
}

/* ---------------------------------------------------------
   14. Reminder engine
   --------------------------------------------------------- */
function computeReminders() {
  const out = [];
  const today = todayISO();

  db.applications.forEach(function (a) {
    if (['Withdrawn','Closed'].indexOf(a.status) !== -1) return;

    if (a.followUpDate && ACTIVE_STATUSES.indexOf(a.status) !== -1) {
      const diff = daysBetween(today, a.followUpDate);
      if (diff < 0) out.push({ level:'danger', appId:a.id,
        text:'Follow-up overdue by ' + Math.abs(diff) + ' day(s): ' + a.company + ' — ' + a.jobTitle, actionName:'log-followup-for' });
      else if (diff === 0) out.push({ level:'warning', appId:a.id,
        text:'Follow-up due today: ' + a.company + ' — ' + a.jobTitle, actionName:'log-followup-for' });
      else if (diff <= 3) out.push({ level:'info', appId:a.id,
        text:'Follow-up in ' + diff + ' day(s): ' + a.company + ' — ' + a.jobTitle, actionName:'log-followup-for' });
    }

    if (a.applicationDate && a.status === 'Applied' && !(a.responseDetails || '').trim()) {
      const days = daysBetween(a.applicationDate, today);
      if (days >= 14) out.push({ level:'info', appId:a.id,
        text:'No response for ' + days + ' days: ' + a.company + ' — ' + a.jobTitle, actionName:'wf-record-response' });
    }

    if (a.status === 'Ready to Apply') {
      const emp = findEmployerForApp(a);
      if (!isEmployerVerified(emp)) out.push({ level:'warning', appId:a.id,
        text:'Employer not verified: ' + a.company, actionName: emp ? 'wf-open-employer' : 'wf-add-employer' });
      if (!(a.workPermitSupport && a.workPermitSupport !== 'Unknown' && a.workPermitCheckedAt)) {
        out.push({ level:'warning', appId:a.id,
          text:'Work-permit eligibility not checked: ' + a.company + ' — ' + a.jobTitle, actionName:'wf-check-permit' });
      }
    }

    if (a.status === 'Offer Received' && !a.offerEvaluatedAt) {
      out.push({ level:'warning', appId:a.id,
        text:'Offer needs evaluation: ' + a.company + ' — ' + a.jobTitle, actionName:'wf-evaluate-offer' });
    }
    if (a.offerEvaluatedAt && !a.workAuthVerifiedAt) {
      out.push({ level:'warning', appId:a.id,
        text:'Verify work authorization: ' + a.company + ' — ' + a.jobTitle, actionName:'wf-verify-auth' });
    }
  });

  db.aiDrafts.forEach(function (d) {
    if (d.status !== 'Draft') return;
    if (!d.applicationId) return;
    const app = findById(db.applications, d.applicationId);
    if (!app) return;
    if (['Withdrawn','Closed','Rejected'].indexOf(app.status) !== -1) return;
    out.push({ level:'info', draftId:d.id,
      text:'Draft needs approval: ' + DRAFT_TYPES[d.type].label + ' for ' + app.company, actionName:'open-draft' });
  });

  db.employers.forEach(function (emp) {
    const counts = employerWarnCounts(emp);
    if (!counts.danger) return;
    const liveLinked = db.applications.filter(function (a) {
      return a.company && a.company.toLowerCase() === String(emp.legalName || '').toLowerCase() &&
        (ACTIVE_STATUSES.indexOf(a.status) !== -1 || a.status === 'Ready to Apply' || a.status === 'Draft');
    });
    if (!liveLinked.length) return;
    const first = employerWarnings(emp).filter(function (w) { return w.level === 'danger'; })[0];
    out.push({ level:'danger', employerId: emp.id,
      text:'Employer red flag: ' + emp.legalName + ' — ' + first.text, actionName:'open-employer' });
  });

  db.interviews.forEach(function (i) {
    if (!i.date || i.date < today) return;
    if (i.outcome && i.outcome !== 'Scheduled' && i.outcome !== 'Awaiting response') return;
    const days = daysBetween(today, i.date);
    if (days <= 2) {
      out.push({ level: days === 0 ? 'warning' : 'info', interviewId:i.id,
        text:'Interview ' + (days === 0 ? 'today' : 'in ' + days + ' day(s)') + ': ' +
             i.employer + ' — ' + (i.jobTitle || ''), actionName:'edit-interview' });
    }
  });

  db.leads.forEach(function (l) {
    if (!l.applicationDeadline) return;
    if (['Applied','Archived'].indexOf(l.stage) !== -1) return;
    const days = daysBetween(today, l.applicationDeadline);
    if (days < 0) out.push({ level:'danger', leadId:l.id,
      text:'Deadline passed: ' + l.company + ' — ' + l.jobTitle, actionName:'edit-lead' });
    else if (days <= 3) out.push({ level:'warning', leadId:l.id,
      text:'Deadline in ' + days + ' day(s): ' + l.company + ' — ' + l.jobTitle, actionName:'edit-lead' });
  });

  return out.sort(function (a, b) { return REMINDER_ORDER[a.level] - REMINDER_ORDER[b.level]; });
}

/* ---------------------------------------------------------
   16. Toast + modal system
   --------------------------------------------------------- */
function toast(message, kind) {
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = message;
  root.appendChild(el);
  setTimeout(function () {
    el.style.opacity = '0';
    el.style.transition = 'opacity .25s ease';
    setTimeout(function () { el.remove(); }, 260);
  }, 3600);
}

let modalOpenFlag = false;

function openModal(opts) {
  const root = $('#modalRoot');
  const footer = opts.footer ? '<footer>' + opts.footer + '</footer>' : '';
  root.innerHTML =
    '<div class="modal-backdrop" data-backdrop>' +
      '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' +
        '<header><h2 id="modalTitle">' + esc(opts.title || '') + '</h2>' +
          '<button type="button" class="icon-btn" data-close aria-label="Close dialog">✕</button>' +
        '</header>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        footer +
      '</div>' +
    '</div>';
  document.body.style.overflow = 'hidden';
  modalOpenFlag = true;
  const modal = $('.modal', root);
  if (opts.onMount) opts.onMount(modal);
  const focusTarget = modal.querySelector('textarea, input:not([type=hidden]):not([type=checkbox]), select, button');
  if (focusTarget) setTimeout(function () { try { focusTarget.focus(); } catch (e) {} }, 30);
}

function closeModal() {
  $('#modalRoot').innerHTML = '';
  document.body.style.overflow = '';
  modalOpenFlag = false;
}

document.addEventListener('click', function (e) {
  if (!modalOpenFlag) return;
  if (e.target.closest('[data-close]')) { closeModal(); return; }
  if (e.target.classList && e.target.classList.contains('modal-backdrop')) closeModal();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && modalOpenFlag) closeModal();
});

function confirmDialog(opts) {
  openModal({
    title: opts.title || 'Please confirm',
    body: '<p class="confirm-text">' + esc(opts.message || '') + '</p>',
    footer: '<button type="button" class="btn btn-outline" data-close>Cancel</button>' +
            '<button type="button" class="btn ' + (opts.danger === false ? 'btn-primary' : 'btn-danger') +
            '" id="confirmYes">' + esc(opts.confirmLabel || 'Confirm') + '</button>',
    onMount: function (modal) {
      $('#confirmYes', modal).addEventListener('click', function () {
        closeModal();
        if (opts.onConfirm) opts.onConfirm();
      });
    }
  });
}

function confirmTyped(opts) {
  openModal({
    title: opts.title || 'Confirm',
    body: '<p class="confirm-text">' + esc(opts.message) + '</p>' +
          '<div class="field"><label for="typedConfirm">Type <strong>' + esc(opts.word) +
          '</strong> to continue</label><input id="typedConfirm" type="text" autocomplete="off"></div>',
    footer: '<button type="button" class="btn btn-outline" data-close>Cancel</button>' +
            '<button type="button" class="btn btn-danger" id="typedYes" disabled>' +
            esc(opts.confirmLabel || 'Confirm') + '</button>',
    onMount: function (modal) {
      const input = $('#typedConfirm', modal);
      const btn = $('#typedYes', modal);
      input.addEventListener('input', function () {
        btn.disabled = input.value.trim().toUpperCase() !== String(opts.word).toUpperCase();
      });
      btn.addEventListener('click', function () {
        closeModal();
        if (opts.onConfirm) opts.onConfirm();
      });
    }
  });
}

/* ---------------------------------------------------------
   17. Generic form builder
   --------------------------------------------------------- */
function fieldHtml(f, value) {
  const id = 'f_' + f.key;
  let v = value;
  if (v === undefined || v === null) v = (f.default !== undefined ? f.default : '');
  const common = 'id="' + id + '" name="' + esc(f.key) + '"';
  let control = '';

  switch (f.type) {
    case 'textarea':
      control = '<textarea ' + common + ' rows="' + (f.rows || 3) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>';
      break;
    case 'select':
      control = '<select ' + common + '>' + optionsHtml(f.options || [], v, f.placeholder !== undefined ? f.placeholder : 'Select…') + '</select>';
      break;
    case 'checkbox':
      control = '<label class="checkline"><input type="checkbox" ' + common + (v ? ' checked' : '') + '> <span>' + esc(f.checkboxLabel || 'Yes') + '</span></label>';
      break;
    default:
      control = '<input type="' + (f.type || 'text') + '" ' + common +
        ' value="' + esc(v) + '" placeholder="' + esc(f.placeholder || '') + '"' +
        (f.min !== undefined ? ' min="' + esc(f.min) + '"' : '') +
        (f.max !== undefined ? ' max="' + esc(f.max) + '"' : '') +
        (f.step !== undefined ? ' step="' + esc(f.step) + '"' : '') +
        (f.inputmode ? ' inputmode="' + esc(f.inputmode) + '"' : '') +
        ' autocomplete="off">';
  }

  return '<div class="field' + (f.full ? ' full' : '') + '" data-field="' + esc(f.key) + '">' +
    '<label for="' + id + '">' + esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</label>' +
    control +
    (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') +
    '<p class="err" hidden></p>' +
  '</div>';
}

function collectForm(fields, form) {
  const data = {};
  let ok = true;
  let firstInvalid = null;

  fields.forEach(function (f) {
    const el = form.elements[f.key];
    if (!el) return;
    const wrap = form.querySelector('[data-field="' + f.key + '"]');
    const errEl = wrap ? wrap.querySelector('.err') : null;

    let value;
    if (f.type === 'checkbox') value = el.checked;
    else value = String(el.value || '').trim();

    let msg = '';
    if (f.required && (value === '' || value === false)) msg = 'This field is required.';
    else if (value && f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) msg = 'Enter a valid email address.';
    else if (value && f.type === 'url' && !/^https?:\/\/\S+$/i.test(value)) msg = 'Enter a full URL starting with http:// or https://.';
    else if (value && f.type === 'number' && isNaN(Number(value))) msg = 'Enter a number.';
    else if (value && f.type === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(value)) msg = 'Enter a valid date.';

    if (msg) {
      ok = false;
      if (wrap) wrap.classList.add('invalid');
      if (errEl) { errEl.textContent = msg; errEl.hidden = false; }
      if (!firstInvalid) firstInvalid = el;
    } else {
      if (wrap) wrap.classList.remove('invalid');
      if (errEl) { errEl.textContent = ''; errEl.hidden = true; }
    }
    data[f.key] = value;
  });

  if (!ok) { if (firstInvalid) { try { firstInvalid.focus(); } catch (e) {} } return null; }
  return data;
}

function setFieldError(form, key, message) {
  if (!form) return;
  const wrap = form.querySelector('[data-field="' + key + '"]');
  if (!wrap) return;
  wrap.classList.add('invalid');
  const err = wrap.querySelector('.err');
  if (err) { err.textContent = message; err.hidden = false; }
}

function openForm(opts) {
  const fields = opts.fields;
  const values = opts.values || {};
  let inner = '';
  let lastSection = null;
  fields.forEach(function (f) {
    if (f.section && f.section !== lastSection) {
      lastSection = f.section;
      inner += '<div class="form-section">' + esc(f.section) + '</div>';
    }
    inner += fieldHtml(f, values[f.key]);
  });

  openModal({
    title: opts.title,
    body: '<form id="entityForm" novalidate><div class="form-grid">' + inner + '</div></form>',
    footer: '<button type="button" class="btn btn-outline" data-close>Cancel</button>' +
            '<button type="submit" form="entityForm" class="btn btn-primary">' + esc(opts.submitLabel || 'Save') + '</button>',
    onMount: function (modal) {
      const form = $('#entityForm', modal);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const data = collectForm(fields, form);
        if (!data) { toast('Please fix the highlighted fields.', 'error'); return; }
        opts.onSubmit(data, form);
      });
    }
  });
}

/* ---------------------------------------------------------
   19. Record persistence helpers
   --------------------------------------------------------- */
function saveRecord(collection, record, isNew) {
  const arr = db[collection];
  const now = new Date().toISOString();
  const existingIndex = arr.findIndex(function (r) { return r.id === record.id; });

  if (isNew || existingIndex === -1) {
    const copy = Object.assign({}, record);
    copy.id = uid(collection.slice(0, 3), arr);
    copy.createdAt = now;
    copy.updatedAt = now;
    arr.push(copy);
  } else {
    arr[existingIndex] = Object.assign({}, arr[existingIndex], record, { updatedAt: now });
  }
  saveDB();
}

function deleteRecord(collection, id, label, extra) {
  confirmDialog({
    title: 'Delete record',
    message: 'Delete "' + label + '"? This cannot be undone.',
    confirmLabel: 'Delete',
    onConfirm: function () {
      db[collection] = db[collection].filter(function (r) { return r.id !== id; });
      if (extra) extra();
      saveDB();
      render();
      toast('Deleted.', 'success');
    }
  });
}

function applicationForm(existing, preset) {
  const wasSubmitted = existing ? SUBMITTED_STATUSES.indexOf(existing.status) !== -1 : false;
  const fields = applicationFields({ wasSubmitted: wasSubmitted });
  const isNew = !existing;

  openForm({
    title: isNew ? 'New application' : 'Edit application',
    fields: fields,
    values: existing ? Object.assign({}, existing) : Object.assign({}, preset || {}),
    submitLabel: isNew ? 'Save application' : 'Save changes',
    onSubmit: function (data) {
      const willSubmit = SUBMITTED_STATUSES.indexOf(data.status) !== -1;
      if (willSubmit && !wasSubmitted) {
        if (!data.__submitConfirm) {
          toast('Confirm you personally submitted the application (see checkbox).', 'error');
          const cb = document.querySelector('[data-field="__submitConfirm"]');
          if (cb) {
            cb.classList.add('invalid');
            const err = cb.querySelector('.err');
            if (err) { err.textContent = 'Confirmation is required before marking as submitted.'; err.hidden = false; }
            cb.scrollIntoView({ block:'center', behavior:'smooth' });
          }
          return;
        }
        if (!data.applicationDate) {
          toast('A submission date is required before marking as submitted.', 'error');
          return;
        }
        data.submittedConfirmedAt = new Date().toISOString();
      }
      delete data.__submitConfirm;

      if (!data.followUpDate && data.applicationDate) data.followUpDate = addDaysISO(data.applicationDate, 7);
      if (!isNew) data.id = existing.id;

      const oldStatus = existing ? existing.status : '';
      const oldFollowUp = existing ? existing.followUpDate : '';

      saveRecord('applications', data, isNew);
      const savedId = isNew ? db.applications[db.applications.length - 1].id : existing.id;

      if (isNew) auditLog({ entityId: savedId, action: 'Application created', to: data.status });
      else if (oldStatus !== data.status) {
        auditLog({ entityId: savedId, action: 'Status changed', field: 'status', from: oldStatus, to: data.status });
      }
      if (data.submittedConfirmedAt && (!existing || !existing.submittedConfirmedAt)) {
        auditLog({ entityId: savedId, action: 'Submission manually confirmed',
          note: data.applicationDate ? 'Submission date recorded: ' + data.applicationDate : '' });
      }
      if (!isNew && oldFollowUp !== data.followUpDate && data.followUpDate) {
        auditLog({ entityId: savedId, action: 'Follow-up date set',
          field: 'followUpDate', from: oldFollowUp, to: data.followUpDate });
      }
      if (preset && preset.__fromLeadId) {
        const lead = findById(db.leads, preset.__fromLeadId);
        if (lead) { lead.stage = 'Applied'; lead.updatedAt = new Date().toISOString(); }
      }
      saveDB();
      closeModal();
      render();
      toast(isNew ? 'Application saved.' : 'Application updated.', 'success');
    }
  });
}

  if (!emp) return;

  const ws = employerWarnings(emp);
  const counts = employerWarnCounts(emp);
  const checks = employerChecklist(emp);
  const doneChecks = checks.filter(function (c) { return c.ok; }).length;

  const audit = (db.audit || [])
    .filter(function (a) { return a.entity === 'employer' && a.entityId === emp.id; })
    .sort(function (a, b) { return String(b.ts).localeCompare(String(a.ts)); })
    .slice(0, 25);

  const linkedApps = db.applications.filter(function (a) {
    return a.company && a.company.toLowerCase() === String(emp.legalName || '').toLowerCase();
  });

  const auditHtml = audit.length
    ? '<ul class="list-plain">' + audit.map(function (a) {
        const parts = [];
        if (a.from || a.to) parts.push(esc(a.from || '—') + ' → ' + esc(a.to || '—'));
        return '<li><span class="li-main"><strong>' + esc(a.action) + '</strong>' +
          (a.field ? ' · <em>' + esc(a.field) + '</em>' : '') +
          (parts.length ? '<div class="small muted">' + parts.join(' · ') + '</div>' : '') +
          (a.note ? '<div class="small muted">' + esc(a.note) + '</div>' : '') +
          '</span><span class="li-meta">' + esc(relTime(a.ts)) + '</span></li>';
      }).join('') + '</ul>'
    : '<p class="muted small">No audit history for this employer yet.</p>';

  const linkedHtml = linkedApps.length
    ? '<ul class="list-plain">' + linkedApps.map(function (a) {
        return '<li><span class="li-main">' + esc(a.jobTitle) + ' ' + statusBadge(a.status) + '</span>' +
          '<span class="li-meta">' + esc(fmtDate(a.applicationDate)) + '</span></li>';
      }).join('') + '</ul>'
    : '<p class="muted small">No applications reference this employer.</p>';

  const verified = isEmployerVerified(emp);

  openModal({
    title: 'Employer check — ' + (emp.legalName || 'Unnamed'),
    wide: true,
    body:
      '<div class="notice ' + (counts.danger ? 'danger' : counts.warning ? 'warn' : '') + '">' +
        '<div class="grow"><strong>' + esc(emp.legalName || 'Unnamed employer') + '</strong>' +
          '<div class="small" style="margin-top:4px">' + verifyBadge(emp.verificationStatus) + ' ' +
            badge(emp.employmentModel || 'Unclear', emp.employmentModel === 'Direct employment' ? 'navy' : 'amber') +
            ' ' + permitBadge(emp.workPermitSupport) + '</div>' +
          '<div class="small muted" style="margin-top:6px">' +
            (verified ? 'Verification complete: ' + doneChecks + ' of ' + checks.length + ' checks satisfied.'
                      : 'Not fully verified — ' + doneChecks + ' of ' + checks.length + ' checks satisfied. ' +
                        'A website alone is never treated as verification.') +
          '</div></div>' +
      '</div>' +
      '<h3 style="font-size:14px;margin:4px 0 8px">Warnings <span class="muted">(' + ws.length + ')</span></h3>' +
      warningsHtml(emp) +
      '<hr><h3 style="font-size:14px;margin:0 0 8px">Verification checklist</h3>' +
      '<ul class="check-list">' + checks.map(function (c) {
        return '<li class="check-item' + (c.ok ? ' ok' : '') + '"><span class="ci-mark">' +
          (c.ok ? '✓' : '') + '</span><span>' + esc(c.text) + '</span></li>';
      }).join('') + '</ul>' +
      '<hr><h3 style="font-size:14px;margin:0 0 8px">Employer record</h3>' +
      '<dl class="dl-grid">' +
        dlRow('Legal company name', esc(emp.legalName)) +
        dlRow('Official website', emp.website ? '<a href="' + esc(emp.website) + '" target="_blank" rel="noopener noreferrer">' + esc(emp.website) + '</a>' : '') +
        dlRow('Official careers page', emp.careersUrl ? '<a href="' + esc(emp.careersUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(emp.careersUrl) + '</a>' : '') +
        dlRow('Company address', esc(emp.address)) +
        dlRow('Recruiter identity',
          esc([emp.recruiterName, emp.recruiterRole].filter(Boolean).join(' — ')) +
          (emp.recruiterIdentityConfirmed ? ' <span class="badge green">Identity confirmed</span>'
            : (emp.recruiterName ? ' <span class="badge amber">Not confirmed</span>' : '')) +
          (emp.recruiterEmail ? '<div class="small muted">' + esc(emp.recruiterEmail) + '</div>' : '') +
          (emp.recruiterPhone ? '<div class="small muted">' + esc(emp.recruiterPhone) + '</div>' : '')) +
        dlRow('Agency registration',
          emp.employmentModel === 'Agency employment'
            ? esc([emp.agencyName, emp.agencyRegistration, emp.agencyCountry].filter(Boolean).join(' · '))
            : 'Direct employment — not applicable') +
        dlRow('Employment model', esc(emp.employmentModel || 'Unclear')) +
        dlRow('Contract type', esc(emp.contractType || 'Not specified') +
          (emp.contractClarity ? ' <span class="small muted">(' + esc(emp.contractClarity) + ')</span>' : '')) +
        dlRow('Salary', esc(money(emp.salaryAmount, emp.salaryCurrency)) +
          (emp.salaryPeriod ? ' / ' + esc(emp.salaryPeriod.toLowerCase()) : '')) +
        dlRow('Accommodation costs', esc(emp.accommodationProvided || 'Unknown') +
          (emp.accommodationCost ? ' — ' + esc(emp.accommodationCost) + ' PLN' : '')) +
        dlRow('Transport costs', esc(emp.transportProvided || 'Unknown') +
          (emp.transportCost ? ' — ' + esc(emp.transportCost) + ' PLN' : '')) +
        dlRow('Recruitment fees', esc(emp.recruitmentFee || 'Unknown') +
          (emp.recruitmentFeeAmount ? ' — ' + esc(money(emp.recruitmentFeeAmount, emp.recruitmentFeeCurrency)) : '')) +
        dlRow('Work-permit support', permitBadge(emp.workPermitSupport) +
          (emp.workPermitConfirmedBy ? ' <span class="small muted">Confirmed by: ' + esc(emp.workPermitConfirmedBy) + '</span>' : '')) +
        dlRow('Sensitive documents', emp.sensitiveDocsRequest
          ? '<span class="badge red">Requested</span> ' + esc(emp.sensitiveDocsChannel || '') : 'None recorded') +
        dlRow('Other red flags', esc(emp.redFlags)) +
        dlRow('Verification date', esc(fmtDate(emp.verificationDate))) +
        dlRow('Evidence URL', emp.evidenceUrl
          ? '<a href="' + esc(emp.evidenceUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(emp.evidenceUrl) + '</a>' : '') +
        dlRow('Verification notes', esc(emp.verificationNotes)) +
        dlRow('General notes', esc(emp.notes)) +
      '</dl>' +
      '<hr><h3 style="font-size:14px;margin:0 0 8px">Linked applications <span class="muted">(' + linkedApps.length + ')</span></h3>' +
      linkedHtml +
      '<hr><h3 style="font-size:14px;margin:0 0 8px">Audit history</h3>' + auditHtml,
    footer:
      '<button type="button" class="btn btn-outline" data-close>Close</button>' +
      (emp.careersUrl ? '<a class="btn btn-outline" href="' + esc(emp.careersUrl) + '" target="_blank" rel="noopener noreferrer">Careers page</a>' : '') +
      '<button type="button" class="btn btn-primary" data-action="edit-employer" data-id="' + esc(emp.id) + '">Edit verification</button>'
  });
}

/* ---------------------------------------------------------
   22. AI Prep — page renderer
   --------------------------------------------------------- */
function renderPrepare() {
  const tabs = [
    { id:'match',     label:'Job match' },
    { id:'drafts',    label:'Drafts' },
    { id:'interview', label:'Interview prep' },
    { id:'check',     label:'Check a message' },
    { id:'profile',   label:'Experience profile' },
    { id:'ai',        label:'AI settings' }
  ];

  const tabHtml = '<div class="tabs" role="tablist">' + tabs.map(function (t) {
    return '<button type="button" class="tab' + (ui.prepare.tab === t.id ? ' active' : '') +
      '" role="tab" aria-selected="' + (ui.prepare.tab === t.id ? 'true' : 'false') +
      '" data-action="prep-tab" data-tab="' + t.id + '">' + esc(t.label) + '</button>';
  }).join('') + '</div>';

  let body = '';
  if (ui.prepare.tab === 'match') body = prepareMatchTab();
  else if (ui.prepare.tab === 'drafts') body = prepareDraftsTab();
  else if (ui.prepare.tab === 'interview') body = prepareInterviewTab();
  else if (ui.prepare.tab === 'check') body = prepareCheckTab();
  else if (ui.prepare.tab === 'profile') body = prepareProfileTab();
  else body = prepareAITab();

  return '' +
  '<div class="page-head">' +
    '<div><h1>AI Prep</h1><p class="sub">Match your real experience against a job advert, prepare documents, ' +
      'and check for scams. JobTrack never invents facts and never sends anything for you.</p></div>' +
    (aiConfigured() ? '<span class="badge purple">AI connected</span>' : '<span class="badge gray">Templates only</span>') +
  '</div>' +
  trustBanner() +
  tabHtml +
  body;
}

function trustBanner() {
  return '<div class="trust-banner">' +
    '<span style="font-size:16px;line-height:1.2">🔒</span>' +
    '<div class="grow"><strong>Facts come from your profile — nothing else.</strong> ' +
    'Every draft is generated only from the experience you recorded. Nothing is ever submitted or sent by JobTrack: ' +
    'you approve each draft, then copy it and send it yourself. ' +
    (aiConfigured()
      ? 'AI output can still drift — every draft is scanned for claims that are not in your profile.'
      : 'No AI provider is configured, so you get editable templates and copyable prompts instead.') +
    '</div></div>';
}

function prepareMatchTab() {
  const f = ui.prepare.form;
  const appOptions = db.applications.slice()
    .sort(function (a, b) { return (a.company || '').localeCompare(b.company || ''); })
    .map(function (a) { return { id: a.id, label: a.company + ' — ' + a.jobTitle }; });
  const leadOptions = db.leads.slice()
    .sort(function (a, b) { return (a.company || '').localeCompare(b.company || ''); })
    .map(function (l) { return { id: l.id, label: l.company + ' — ' + l.jobTitle }; });

  const report = ui.prepare.lastReportId ? findById(db.matchReports, ui.prepare.lastReportId) : null;
  const recent = db.matchReports.slice()
    .sort(function (a, b) { return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); })
    .slice(0, 6);

  return '' +
  '<div class="card">' +
    '<h2>Analyse a job advert</h2>' +
    '<div class="form-grid">' +
      '<div class="field"><label for="pmTitle">Job title</label>' +
        '<input id="pmTitle" data-prep-field="jobTitle" value="' + esc(f.jobTitle) + '" placeholder="e.g. Warehouse Operative"></div>' +
      '<div class="field"><label for="pmCompany">Company</label>' +
        '<input id="pmCompany" data-prep-field="company" value="' + esc(f.company) + '" placeholder="e.g. Vistula Logistics"></div>' +
      '<div class="field"><label for="pmApp">Link to application</label>' +
        '<select id="pmApp" data-prep-field="applicationId">' + optionsHtml(appOptions, f.applicationId, 'Not linked') + '</select></div>' +
      '<div class="field"><label for="pmLead">Link to lead</label>' +
        '<select id="pmLead" data-prep-field="leadId">' + optionsHtml(leadOptions, f.leadId, 'Not linked') + '</select></div>' +
      '<div class="field full"><label for="pmJd">Job description <span class="req">*</span></label>' +
        '<textarea id="pmJd" rows="9" data-prep-field="jobDescription" placeholder="Paste the full advert here — duties, requirements, contract terms, language requirements. The more complete the text, the more accurate the analysis.">' +
        esc(f.jobDescription) + '</textarea>' +
        '<p class="hint">Paste everything. The analyser reads requirements, language levels, contract wording and scam signals from this text.</p>' +
      '</div>' +
    '</div>' +
    '<div class="form-actions">' +
      '<button type="button" class="btn btn-primary" data-action="run-match">Analyse advert</button>' +
      '<button type="button" class="btn btn-outline" data-action="clear-match-form">Clear</button>' +
    '</div>' +
  '</div>' +
  (report ? reportHtml(report) : '') +
  (recent.length && (!report || recent[0].id !== report.id)
    ? '<div class="card"><h2>Previous analyses</h2><ul class="list-plain">' +
      recent.map(function (r) {
        return '<li><span class="li-main"><strong>' + esc(r.jobTitle || 'Untitled') + '</strong>' +
          (r.company ? ' — ' + esc(r.company) : '') +
          '<div class="small muted">' + r.score + '/100 · ' + esc(r.bandLabel) + '</div></span>' +
          '<span class="li-meta"><button type="button" class="btn btn-sm btn-outline" data-action="open-report" data-id="' +
          esc(r.id) + '">Open</button></span></li>';
      }).join('') + '</ul></div>'
    : '');
}

function reportHtml(r) {
  const band = bandFor(r.score);
  const pct = r.score;

  const critRows = r.criteria.map(function (c) {
    const awarded = Math.round(c.awarded * 10) / 10;
    return '<tr>' +
      '<td data-label="Criterion"><strong>' + esc(c.label) + '</strong>' +
        '<div class="crit-note">' + esc(c.rule) + '</div></td>' +
      '<td data-label="Weight" class="crit-score">' + c.max + '</td>' +
      '<td data-label="Score" class="crit-score">' + awarded + ' <span class="crit-max">/ ' + c.max + '</span></td>' +
      '<td data-label="Reason"><div class="crit-note">' + esc(c.reason) + '</div>' +
        (c.matched && c.matched.length ? '<div class="crit-matched">Matched: ' + esc(c.matched.slice(0, 6).join(', ')) + '</div>' : '') +
      '</td></tr>';
  }).join('');

  const missingHtml = r.missing.length
    ? '<ul class="warn-list">' + r.missing.map(function (m) {
        const ico = m.severity === 'high' ? '⚠' : m.severity === 'medium' ? '!' : 'ℹ';
        const lvl = m.severity === 'high' ? 'danger' : m.severity === 'medium' ? 'warning' : 'info';
        return '<li class="warn-item ' + lvl + '"><span class="wi-ico">' + ico + '</span>' +
          '<span><strong>' + esc(m.label) + '</strong> — ' + esc(m.evidence) +
          (m.advice ? '<div class="small muted" style="margin-top:3px">' + esc(m.advice) + '</div>' : '') +
          '</span></li>';
      }).join('') + '</ul>'
    : '<p class="warn-empty">No gaps detected. Your profile covers everything the advert asks for that JobTrack can check.</p>';

  const suspHtml = r.suspicious.length
    ? '<ul class="warn-list">' + r.suspicious.map(function (s) {
        return '<li class="warn-item ' + esc(s.level) + '">' +
          '<span class="wi-ico">' + (s.level === 'danger' ? '⚠' : s.level === 'warning' ? '!' : 'ℹ') + '</span>' +
          '<span><strong>' + esc(s.title) + '</strong>' +
            '<div class="small" style="margin-top:3px"><em>“' + esc(s.evidence) + '”</em></div>' +
            '<div class="small muted" style="margin-top:3px">' + esc(s.why) + '</div>' +
          '</span></li>';
      }).join('') + '</ul>'
    : '<p class="warn-empty">No suspicious recruitment claims detected in this advert.</p>';

  const cvHtml = r.cv.recommendedLabel
    ? '<div class="notice purple"><div class="grow"><strong>Recommended CV: ' + esc(r.cv.recommendedLabel) + '</strong>' +
        '<div class="small" style="margin-top:4px">' + esc(r.cv.reason) + '</div>' +
        (r.cv.alternatives && r.cv.alternatives.length
          ? '<div class="small muted" style="margin-top:6px">Alternatives: ' +
            r.cv.alternatives.map(function (a) { return esc(a.label); }).join(' · ') + '</div>' : '') +
      '</div>' +
      '<button type="button" class="btn btn-outline btn-sm" data-action="goto-documents">Open Documents</button>' +
    '</div>'
    : '<div class="notice warn"><div class="grow">' + esc(r.cv.reason) + '</div>' +
      '<button type="button" class="btn btn-outline btn-sm" data-action="new-document">Register a CV</button></div>';

  return '<div class="card" style="border-color:#ddd0fb">' +
    '<h2>Analysis — ' + esc(r.jobTitle || 'Untitled role') +
      (r.company ? ' at ' + esc(r.company) : '') + '</h2>' +
    '<div class="score-hero">' +
      '<div class="score-num">' + r.score + '<span class="of">/100</span></div>' +
      '<div class="score-meta">' +
        '<div class="score-band band-' + band.cls + '">' + esc(r.bandLabel) + '</div>' +
        '<div class="small muted">Scored on ' + r.criteria.length + ' weighted criteria. Every point is shown below.</div>' +
        '<div class="score-bar"><div class="score-fill fill-' + band.cls + '" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        '<button type="button" class="btn btn-purple btn-sm" data-action="draft-from-report" data-id="' + esc(r.id) + '" data-type="coverLetter">Draft cover letter</button>' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="draft-from-report" data-id="' + esc(r.id) + '" data-type="recruiterEmail">Draft recruiter email</button>' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="draft-from-report" data-id="' + esc(r.id) + '" data-type="interviewPrep">Interview prep</button>' +
      '</div>' +
    '</div>' +
    '<h3 style="font-size:14px;margin:0 0 8px">How the score was calculated</h3>' +
    '<div class="table-wrap"><table class="crit-table">' +
      '<thead><tr><th>Criterion</th><th>Weight</th><th>Score</th><th>Why</th></tr></thead>' +
      '<tbody>' + critRows +
        '<tr><td data-label="Total"><strong>Total</strong></td>' +
        '<td data-label="Weight" class="crit-score">100</td>' +
        '<td data-label="Score" class="crit-score"><strong>' + r.score + '</strong></td>' +
        '<td data-label="Reason"><div class="crit-note">' + esc(r.bandLabel) + '</div></td></tr>' +
      '</tbody></table></div>' +
    '<hr><h3 style="font-size:14px;margin:0 0 8px">Missing or unconfirmed qualifications <span class="muted">(' + r.missing.length + ')</span></h3>' +
    missingHtml +
    '<hr><h3 style="font-size:14px;margin:0 0 8px">Suspicious recruitment claims <span class="muted">(' + r.suspicious.length + ')</span></h3>' +
    suspHtml +
    '<hr><h3 style="font-size:14px;margin:0 0 8px">CV recommendation</h3>' +
    cvHtml +
  '</div>';
}

function prepareDraftsTab() {
  const filter = ui.prepare.draftFilter;
  let drafts = db.aiDrafts.slice();
  if (filter !== 'All') drafts = drafts.filter(function (d) { return d.status === filter; });
  drafts.sort(function (a, b) { return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')); });

  const counts = { All: db.aiDrafts.length };
  ['Draft','Approved','Sent','Discarded'].forEach(function (s) {
    counts[s] = db.aiDrafts.filter(function (d) { return d.status === s; }).length;
  });

  const filterBar = '<div class="toolbar">' +
    ['All','Draft','Approved','Sent','Discarded'].map(function (s) {
      return '<button type="button" class="tab' + (filter === s ? ' active' : '') +
        '" data-action="draft-filter" data-status="' + esc(s) + '">' + esc(s) + ' (' + (counts[s] || 0) + ')</button>';
    }).join('') +
    '<div class="spacer"></div>' +
    '<button type="button" class="btn btn-outline btn-sm" data-action="new-blank-draft">+ Blank draft</button>' +
  '</div>';

  const list = drafts.length
    ? drafts.map(function (d) {
        const app = d.applicationId ? findById(db.applications, d.applicationId) : null;
        const typeMeta = DRAFT_TYPES[d.type] || DRAFT_TYPES.coverLetter;
        const issues = auditDraftClaims(d.body);
        return '<div class="draft-item">' +
          '<div class="draft-item-head">' +
            '<div class="draft-item-title">' +
              '<span class="badge ' + typeMeta.color + '">' + typeMeta.icon + ' ' + esc(typeMeta.label) + '</span> ' +
              esc(d.title || 'Untitled draft') +
              '<div class="draft-item-meta">' +
                (app ? 'Linked to ' + esc(app.company) + ' — ' + esc(app.jobTitle) + ' · ' : '') +
                'Updated ' + esc(relTime(d.updatedAt)) +
                ' · ' + (d.provider === 'ai' ? 'AI-generated' : 'Template') +
                (d.approvedAt ? ' · Approved ' + esc(relTime(d.approvedAt)) : '') +
                (d.sentAt ? ' · Sent ' + esc(relTime(d.sentAt)) : '') +
              '</div>' +
            '</div>' +
            '<div>' + draftStatusBadge(d.status) +
              (issues.length ? ' <span class="badge red">' + issues.length + ' claim issue' + (issues.length === 1 ? '' : 's') + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="draft-item-actions">' +
            '<button type="button" class="btn btn-sm btn-primary" data-action="open-draft" data-id="' + esc(d.id) + '">Open</button>' +
            '<button type="button" class="btn btn-sm btn-outline" data-action="copy-draft" data-id="' + esc(d.id) + '">Copy</button>' +
            (d.status === 'Draft'
              ? '<button type="button" class="btn btn-sm btn-outline" data-action="approve-draft" data-id="' + esc(d.id) + '">Approve</button>'
              : '') +
            (d.status === 'Approved'
              ? '<button type="button" class="btn btn-sm btn-outline" data-action="mark-draft-sent" data-id="' + esc(d.id) + '">Mark as sent</button>'
              : '') +
            '<button type="button" class="btn btn-sm btn-danger" data-action="delete-draft" data-id="' + esc(d.id) + '">Delete</button>' +
          '</div>' +
        '</div>';
      }).join('')
    : emptyState('No drafts yet',
        'Run a job match, then generate a cover letter, recruiter email or interview prep sheet.',
        'prep-goto-match', 'Go to job match');

  return '<div class="card">' +
    '<h2>Prepared content <span class="count">(' + drafts.length + ')</span></h2>' +
    '<p class="small muted" style="margin-top:-6px">' +
      'Nothing here is sent automatically. Approve a draft to confirm you have reviewed it, then copy it into your own email or portal.' +
    '</p>' +
    filterBar + list +
  '</div>';
}

function prepareInterviewTab() {
  const apps = db.applications.slice()
    .sort(function (a, b) { return (b.applicationDate || '').localeCompare(a.applicationDate || ''); });
  const options = apps.map(function (a) {
    return { id: a.id, label: a.company + ' — ' + a.jobTitle + ' (' + a.status + ')' };
  });
  const prepDrafts = db.aiDrafts.filter(function (d) { return d.type === 'interviewPrep'; })
    .sort(function (a, b) { return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')); });

  return '<div class="card">' +
    '<h2>Generate interview preparation</h2>' +
    '<p class="small muted" style="margin-top:-6px">Builds questions and answer skeletons from your real experience. ' +
      'Anything your profile does not cover appears as a blank to fill in — never as an invented answer.</p>' +
    '<div class="field"><label for="ivApp">Application</label>' +
      '<select id="ivApp">' + optionsHtml(options, '', 'Select an application…') + '</select></div>' +
    '<div class="form-actions">' +
      '<button type="button" class="btn btn-primary" data-action="generate-interview">Generate prep sheet</button>' +
    '</div>' +
  '</div>' +
  '<div class="card">' +
    '<h2>Your prep sheets <span class="count">(' + prepDrafts.length + ')</span></h2>' +
    (prepDrafts.length
      ? '<ul class="list-plain">' + prepDrafts.map(function (d) {
          return '<li><span class="li-main"><strong>' + esc(d.title) + '</strong>' +
            '<div class="small muted">' + esc(relTime(d.updatedAt)) + '</div></span>' +
            '<span class="li-meta">' + draftStatusBadge(d.status) +
            ' <button type="button" class="btn btn-sm btn-outline" data-action="open-draft" data-id="' + esc(d.id) + '">Open</button>' +
            '</span></li>';
        }).join('') + '</ul>'
      : '<p class="muted small">No prep sheets yet.</p>') +
  '</div>';
}

function prepareCheckTab() {
  const text = ui.prepare.checkText || '';

/* ---------------------------------------------------------
   23. Draft lifecycle
   --------------------------------------------------------- */
function createDraft(opts) {
  const now = new Date().toISOString();
  const draft = {
    id: uid('dft', db.aiDrafts),
    createdAt: now, updatedAt: now,
    type: opts.type || 'coverLetter',
    subtype: opts.subtype || '',
    title: opts.title || 'Untitled draft',
    subject: opts.subject || '',
    body: opts.body || '',
    applicationId: opts.applicationId || '',
    leadId: opts.leadId || '',
    employerId: opts.employerId || '',
    reportId: opts.reportId || '',
    provider: opts.provider || 'template',
    model: opts.model || '',
    promptUsed: opts.promptUsed || '',
    facts: opts.facts || [],
    status: 'Draft',
    approvedAt: '', approvedHash: '', sentAt: ''
  };
  db.aiDrafts.push(draft);
  auditLog({ entity: 'draft', entityId: draft.id,
    action: 'Draft created', to: DRAFT_TYPES[draft.type].label, note: draft.title });
  saveDB();
  return draft;
}

function updateDraft(id, patch) {
  const d = findById(db.aiDrafts, id);
  if (!d) return null;
  const bodyChanged = patch.body !== undefined && patch.body !== d.body;
  Object.assign(d, patch);
  d.updatedAt = new Date().toISOString();
  if (bodyChanged && d.status === 'Approved') {
    d.status = 'Draft'; d.approvedAt = ''; d.approvedHash = '';
  }
  if (bodyChanged && d.status === 'Sent') {
    d.status = 'Draft'; d.approvedAt = ''; d.approvedHash = ''; d.sentAt = '';
  }
  saveDB();
  return d;
}

function approveDraft(id, silent) {
  const d = findById(db.aiDrafts, id);
  if (!d) return false;
  if (String(d.body || '').trim().length < 20) {
    toast('This draft is too short to approve.', 'error');
    return false;
  }
  d.status = 'Approved';
  d.approvedAt = new Date().toISOString();
  d.approvedHash = simpleHash(d.body);
  d.updatedAt = d.approvedAt;
  auditLog({ entity: 'draft', entityId: d.id, action: 'Draft approved',
    to: DRAFT_TYPES[d.type].label, note: d.title + (d.subtype ? ' (' + d.subtype + ')' : '') });
  saveDB();
  if (!silent) toast('Draft approved. You can now mark it as sent.', 'success');
  return true;
}

function markDraftSent(id) {
  const d = findById(db.aiDrafts, id);
  if (!d) return;
  if (d.status !== 'Approved') { toast('Approve the draft before marking it as sent.', 'error'); return; }
  confirmDialog({
    title: 'Mark as sent',
    message: 'Confirm that you have already sent this ' + DRAFT_TYPES[d.type].label.toLowerCase() +
      ' yourself. JobTrack does not send anything — this only records that you did.',
    confirmLabel: 'Yes, I sent it', danger: false,
    onConfirm: function () {
      d.status = 'Sent';
      d.sentAt = new Date().toISOString();
      d.updatedAt = d.sentAt;
      auditLog({ entity:'draft', entityId: d.id, action:'Marked as sent by user', note: d.title });
      saveDB();
      render();
      toast('Recorded as sent.', 'success');
    }
  });
}

function copyDraftToClipboard(id) {
  const d = findById(db.aiDrafts, id);
  if (!d) return;
  const text = (d.subject ? 'Subject: ' + d.subject + '\n\n' : '') + d.body;
  copyText(text).then(function (ok) {
    if (ok) {
      auditLog({ entity:'draft', entityId: d.id, action:'Draft copied to clipboard', note: d.title });
      saveDB();
      toast('Copied. Paste it into your own email client or portal.', 'success');
    } else {
      toast('Copy failed — open the draft and select the text manually.', 'error');
    }
  });
}

function deleteDraft(id) {
  const d = findById(db.aiDrafts, id);
  if (!d) return;
  confirmDialog({
    title: 'Delete draft',
    message: 'Delete "' + (d.title || 'this draft') + '"? This cannot be undone.',
    confirmLabel: 'Delete',
    onConfirm: function () {
      db.aiDrafts = db.aiDrafts.filter(function (x) { return x.id !== id; });
      auditLog({ entity:'draft', entityId: id, action:'Draft deleted', note: d.title });
      saveDB();
      render();
      toast('Draft deleted.', 'success');
    }
  });
}

function openDraftEditor(draftId) {
  const d = findById(db.aiDrafts, draftId);
  if (!d) return;
  const typeMeta = DRAFT_TYPES[d.type] || DRAFT_TYPES.coverLetter;

  const factsHtml = (d.facts && d.facts.length)
    ? '<ul class="facts-list">' + d.facts.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>'
    : '<p class="small muted">No profile facts were recorded for this draft.</p>';

  openModal({
    title: typeMeta.label + ' — ' + (d.title || 'Draft'),
    wide: true,
    body:
      '<div class="draft-editor">' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
          draftStatusBadge(d.status) +
          (d.provider === 'ai' ? '<span class="badge purple">AI-generated</span>' : '<span class="badge gray">Template</span>') +
          (d.approvedAt ? '<span class="small muted">Approved ' + esc(fmtDateTime(d.approvedAt)) + '</span>' : '') +
          (d.sentAt ? '<span class="small muted">Sent ' + esc(fmtDateTime(d.sentAt)) + '</span>' : '') +
        '</div>' +
        '<div class="field"><label for="deTitle">Draft title</label>' +
          '<input id="deTitle" value="' + esc(d.title) + '"></div>' +
        (d.type === 'recruiterEmail' || d.type === 'followUp' || d.type === 'coverLetter'
          ? '<div class="field"><label for="deSubject">Subject</label>' +
            '<input id="deSubject" value="' + esc(d.subject) + '"></div>'
          : '') +
        '<div class="field"><label for="deBody">Body — edit freely</label>' +
          '<textarea id="deBody" class="draft-body">' + esc(d.body) + '</textarea>' +
          '<p class="hint">Every word is editable. Check anything the AI produced against your real record before approving.</p></div>' +
        '<div class="claims-box" id="claimsBox">' +
          '<h4>Claims check</h4>' +
          '<div id="claimsContent"></div>' +
        '</div>' +
        '<div class="claims-box" style="background:#fafbfd">' +
          '<h4>Facts used from your profile</h4>' + factsHtml +
        '</div>' +
      '</div>',
    footer:
      '<button type="button" class="btn btn-danger" data-action="delete-draft" data-id="' + esc(d.id) + '">Delete</button>' +
      '<button type="button" class="btn btn-outline" data-action="copy-draft" data-id="' + esc(d.id) + '">Copy</button>' +
      (aiConfigured() ? '<button type="button" class="btn btn-purple" data-action="improve-draft-ai" data-id="' + esc(d.id) + '">Rewrite with AI</button>' : '') +
      '<button type="button" class="btn btn-outline" data-action="show-draft-prompt" data-id="' + esc(d.id) + '">Show prompt</button>' +
      '<button type="button" class="btn btn-outline" id="deSave">Save</button>' +
      (d.status !== 'Approved' && d.status !== 'Sent'
        ? '<button type="button" class="btn btn-primary" id="deApprove">Approve draft</button>'
        : (d.status === 'Approved'
            ? '<button type="button" class="btn btn-primary" id="deSent">Mark as sent</button>'
            : '')),
    onMount: function (modal) {
      const bodyEl = $('#deBody', modal);
      const claimsBox = $('#claimsBox', modal);
      const claimsContent = $('#claimsContent', modal);

      function refreshClaims() {
        const issues = auditDraftClaims(bodyEl.value);
        claimsBox.classList.toggle('has-issues', issues.length > 0);
        claimsContent.innerHTML = issues.length
          ? '<ul class="warn-list">' + issues.map(function (i) {
              return '<li class="warn-item ' + (i.level === 'danger' ? 'danger' : 'warning') + '">' +
                '<span class="wi-ico">' + (i.level === 'danger' ? '⚠' : '!') + '</span>' +
                '<span><strong>' + esc(i.label) + '</strong>' +
                  '<div class="small" style="margin-top:2px"><em>“' + esc(i.evidence) + '”</em></div>' +
                  '<div class="small muted" style="margin-top:2px">' + esc(i.fix) + '</div>' +
                '</span></li>';
            }).join('') + '</ul>'
          : '<p class="warn-empty">No invented claims detected. Still read the text once before approving.</p>';
      }

      bodyEl.addEventListener('input', refreshClaims);
      refreshClaims();

      $('#deSave', modal).addEventListener('click', function () {
        const patch = { title: $('#deTitle', modal).value.trim() || 'Untitled draft', body: bodyEl.value };
        const subjectEl = $('#deSubject', modal);
        if (subjectEl) patch.subject = subjectEl.value.trim();
        updateDraft(d.id, patch);
        toast('Draft saved.', 'success');
        render();
        closeModal();
      });

      const approveBtn = $('#deApprove', modal);
      if (approveBtn) {
        approveBtn.addEventListener('click', function () {
          updateDraft(d.id, {
            title: $('#deTitle', modal).value.trim() || 'Untitled draft',
            body: bodyEl.value,
            subject: $('#deSubject', modal) ? $('#deSubject', modal).value.trim() : d.subject
          });
          if (approveDraft(d.id)) { render(); closeModal(); }
        });
      }

      const sentBtn = $('#deSent', modal);
      if (sentBtn) {
        sentBtn.addEventListener('click', function () {
          closeModal();
          markDraftSent(d.id);
        });
      }
    }
  });
}

function runMatch() {
  const f = ui.prepare.form;
  const jd = String(f.jobDescription || '').trim();

  if (jd.length < 40) { toast('Paste a fuller job description — at least 40 characters.', 'error'); return; }
  if (!String(f.jobTitle || '').trim()) { toast('Add the job title so the role match can be scored.', 'error'); return; }

  const result = analyzeJob({
    jobTitle: f.jobTitle, company: f.company, jobDescription: jd,
    applicationId: f.applicationId, leadId: f.leadId
  });

  result.createdAt = new Date().toISOString();
  result.updatedAt = result.createdAt;
  result.id = uid('mr', db.matchReports);
  db.matchReports.push(result);

  auditLog({ entity: 'match', entityId: result.id, action: 'Job match analysed',
    to: String(result.score),
    note: (result.jobTitle || '') + (result.company ? ' — ' + result.company : '') +
          ' · ' + result.bandLabel + ' · ' + result.missing.length + ' gap(s) · ' +
          result.suspicious.length + ' suspicious claim(s)' });

  ui.prepare.lastReportId = result.id;
  saveDB();
  render();
  toast('Analysis complete: ' + result.score + '/100 — ' + result.bandLabel, 'success');
}

function draftFromReport(reportId, type) {
  const report = findById(db.matchReports, reportId);
  if (!report) { toast('That analysis no longer exists.', 'error'); return; }

  const p = db.settings.experienceProfile;
  const baseFacts = profileFactLines(p).slice(0, 6);

  if (type === 'recruiterEmail') { openRecruiterEmailChooser(report); return; }

  if (type === 'coverLetter') {
    const built = buildCoverLetter({
      company: report.company, jobTitle: report.jobTitle,
      report: report, recruiterName: report.recruiterName || ''
    });
    const draft = createDraft({
      type: 'coverLetter',
      title: 'Cover letter — ' + (report.jobTitle || 'role') + (report.company ? ' at ' + report.company : ''),
      subject: built.subject, body: built.body,
      applicationId: report.applicationId, leadId: report.leadId,
      reportId: report.id, provider: 'template',
      facts: baseFacts.concat(['Job match score: ' + report.score + '/100 (' + report.bandLabel + ')'])
    });
    render();
    openDraftEditor(draft.id);
    return;
  }

  if (type === 'interviewPrep') {
    const built = buildInterviewPrep({ company: report.company, jobTitle: report.jobTitle, report: report });
    const draft = createDraft({
      type: 'interviewPrep',
      title: 'Interview prep — ' + (report.jobTitle || 'role') + (report.company ? ' at ' + report.company : ''),
      subject: built.subject, body: built.body,
      applicationId: report.applicationId, leadId: report.leadId,
      reportId: report.id, provider: 'template', facts: baseFacts
    });
    render();
    openDraftEditor(draft.id);
  }
}

function openRecruiterEmailChooser(report) {
  const subtypes = [
    { id:'enquiry', label:'Pre-application enquiry', hint:'Ask about permit support, contract, costs and fees before applying.' },
    { id:'applicationFollowUp', label:'Follow-up after applying', hint:'Confirm receipt and restate interest.' },
    { id:'afterInterview', label:'Thank-you after interview', hint:'Short note after an interview.' },
    { id:'permit', label:'Work-permit question', hint:'Ask specifically about permit support and contract timing.' }
  ];

  openModal({
    title: 'Recruiter email — choose a purpose',
    body: '<div style="display:grid;gap:8px">' + subtypes.map(function (s) {
      return '<button type="button" class="btn btn-outline btn-block" style="justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;gap:2px" ' +
        'data-email-subtype="' + esc(s.id) + '">' +
        '<span style="font-weight:700">' + esc(s.label) + '</span>' +
        '<span class="small muted" style="font-weight:400">' + esc(s.hint) + '</span>' +
      '</button>';
    }).join('') + '</div>',
    footer: '<button type="button" class="btn btn-outline" data-close>Cancel</button>',
    onMount: function (modal) {
      $$('[data-email-subtype]', modal).forEach(function (b) {
        b.addEventListener('click', function () {
          const subtype = b.dataset.emailSubtype;
          closeModal();
          const built = buildRecruiterEmail({
            subtype: subtype, company: report.company, jobTitle: report.jobTitle,
            recruiterName: report.recruiterName || ''
