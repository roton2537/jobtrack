<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2144">
<meta name="description" content="JobTrack — job application management with employer verification and AI-assisted preparation.">
<title>JobTrack — Recruitment Workflow, Verification &amp; AI Prep</title>
<style>
/* =========================================================
   JobTrack — styles
   ========================================================= */
:root{
  --navy:#0d2144;
  --navy-2:#14315f;
  --navy-3:#1b3f78;
  --blue:#2563eb;
  --blue-600:#1d4ed8;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#12203a;
  --muted:#5b6b86;
  --line:#e2e8f2;
  --green:#0a7a44;
  --green-bg:#e2f6ea;
  --amber:#8a5a00;
  --amber-bg:#fff2d9;
  --red:#a5271a;
  --red-bg:#fde5e2;
  --purple:#6d28d9;
  --purple-bg:#f1eaff;
  --radius:12px;
  --shadow:0 1px 2px rgba(13,33,68,.06), 0 6px 20px rgba(13,33,68,.05);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;
  background:var(--bg);color:var(--text);
}
h1,h2,h3,h4{margin:0;color:var(--navy)}
p{margin:0 0 8px}
a{color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;background:#fff;padding:10px;z-index:999}
.skip:focus{left:8px;top:8px}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;
  background:var(--navy);color:#fff;
  box-shadow:0 2px 10px rgba(9,20,38,.18);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16.5px;letter-spacing:.2px}
.brand-mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:29px;height:29px;border-radius:8px;
  background:var(--blue);color:#fff;font-size:13px;font-weight:800;letter-spacing:.5px;
}
.topbar-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{
  background:transparent;border:0;color:#fff;font-size:20px;line-height:1;
  padding:9px 11px;border-radius:9px;cursor:pointer;
}
.icon-btn:hover{background:rgba(255,255,255,.14)}
.icon-btn:focus-visible{outline:2px solid #fff;outline-offset:1px}

/* ---------- Layout ---------- */
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 46px)}
.scrim{position:fixed;inset:0;background:rgba(9,20,38,.5);z-index:55;border:0;padding:0;cursor:pointer}
.sidenav{
  position:fixed;top:0;bottom:0;left:0;width:258px;z-index:60;
  background:var(--navy-2);color:#dfe7f5;
  transform:translateX(-105%);transition:transform .22s ease;
  display:flex;flex-direction:column;overflow-y:auto;
  padding:12px 10px 18px;
  -webkit-overflow-scrolling:touch;
}
.sidenav.open{transform:none}
.sidenav .nav-head{padding:6px 10px 14px;font-weight:800;color:#fff;font-size:15px;letter-spacing:.3px}
.nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 12px;border:0;border-radius:9px;
  background:transparent;color:#cfdaee;
  font:inherit;font-weight:500;font-size:14.5px;text-align:left;text-decoration:none;cursor:pointer;
}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600}
.nav-item .nav-ico{width:20px;text-align:center;font-size:15px}
.sidenav-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:#93a5c4;line-height:1.4}
.main{flex:1 1 auto;min-width:0;width:100%;padding:16px 14px 60px;max-width:1240px;margin:0 auto}
@media (min-width:960px){
  .sidenav{position:sticky;top:46px;height:calc(100vh - 46px);transform:none;flex:0 0 252px}
  .scrim{display:none!important}
  #menuBtn{display:none}
  .main{padding:22px 26px 70px}
}

/* ---------- Page head ---------- */
.page-head{
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;
  margin-bottom:16px;
}
.page-head h1{font-size:21px;line-height:1.2;margin-bottom:3px}
.page-head .sub{margin:0;color:var(--muted);font-size:13.5px;max-width:62ch}

/* ---------- Cards / KPIs ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px;margin-bottom:14px;box-shadow:var(--shadow);
}
.card h2{
  font-size:12.5px;margin:0 0 12px;color:var(--navy);
  text-transform:uppercase;letter-spacing:.06em;font-weight:700;
}
.card h2 .count{color:var(--muted);font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (min-width:700px){.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);border-left:4px solid var(--blue);
}
.kpi .k-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.kpi .k-value{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1;margin-top:6px}
.kpi .k-sub{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.k-amber{border-left-color:#e0a12b}
.kpi.k-green{border-left-color:#0a9d5b}
.kpi.k-red{border-left-color:#c0392b}
.kpi.k-navy{border-left-color:var(--navy-3)}
.kpi.k-purple{border-left-color:var(--purple)}

.grid-2{display:grid;gap:14px}
@media (min-width:920px){.grid-2{grid-template-columns:1fr 1fr}}

/* ---------- Bars ---------- */
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 38px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
.bar-row .bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#31456b}
.bar-track{background:#eaeff7;border-radius:6px;height:10px;overflow:hidden}
.bar-fill{height:100%;background:var(--blue);border-radius:6px;transition:width .25s ease}
.bar-fill.green{background:#0a9d5b}
.bar-fill.amber{background:#e0a12b}
.bar-fill.red{background:#c0392b}
.bar-fill.purple{background:var(--purple)}
.bar-row .bar-val{text-align:right;font-weight:700;color:var(--navy)}

/* ---------- Week chart ---------- */
.weeks{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:6px}
.week-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.week-bar{width:100%;background:var(--blue);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .25s ease}
.week-lbl{font-size:10.5px;color:var(--muted);white-space:nowrap}
.week-num{font-size:11px;font-weight:700;color:var(--navy)}

/* ---------- Tables ---------- */
.table-wrap{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow-x:auto;box-shadow:var(--shadow);
}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{
  background:#eef2f9;color:var(--navy);font-size:11.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafd}
td strong{color:var(--navy)}
.row-actions{white-space:nowrap;text-align:right}
.row-actions .btn{margin-left:4px;margin-bottom:4px}
@media (max-width:739px){
  .table-wrap{border:0;background:transparent;box-shadow:none;overflow:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody tr{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:10px;padding:6px 4px;box-shadow:var(--shadow);
  }
  tbody tr:hover{background:var(--card)}
  td{
    display:flex;justify-content:space-between;gap:14px;
    border:0;padding:7px 10px;align-items:baseline;
  }
  td::before{
    content:attr(data-label);
    flex:0 0 40%;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;color:var(--muted);
  }
  td.row-actions{justify-content:flex-end;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
  td.row-actions::before{display:none}
  td.row-actions .btn{margin-left:6px}
}

/* ---------- Badges ---------- */
.badge{
  display:inline-block;padding:2px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:1.6;
}
.badge.gray{background:#eef1f6;color:#4a5a75;border-color:#dde3ee}
.badge.blue{background:#e3edff;color:#1d4ed8}
.badge.navy{background:#e0e7f4;color:#12315f}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.purple{background:var(--purple-bg);color:var(--purple)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:9px;border:1px solid transparent;
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  background:#eef1f6;color:var(--text);text-decoration:none;
  transition:background .12s ease, border-color .12s ease;
}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-600)}
.btn-outline{background:#fff;border-color:#cdd7e6;color:var(--navy)}
.btn-outline:hover{background:#f2f6fc}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#8c1f14}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:#5b21b6}
.btn-ghost{background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.28)}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1 1 200px;min-width:0}
@media (min-width:700px){.toolbar .search{max-width:330px}}
.toolbar select{flex:0 1 auto;min-width:0}
.toolbar .spacer{flex:1 1 auto}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:1fr;gap:13px}
@media (min-width:660px){.form-grid{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}}
.form-section{
  grid-column:1/-1;margin:8px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line);
  font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--navy-3);
}
.form-section:first-child{margin-top:0}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:#25395c;letter-spacing:.01em}
.field .req{color:var(--red)}
input,select,textarea{
  width:100%;padding:10px 11px;border:1px solid #cdd7e6;border-radius:9px;
  font:inherit;font-size:15px;background:#fff;color:var(--text);
}
input[type=checkbox]{width:auto;transform:scale(1.25);margin-right:8px}
textarea{min-height:86px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red);background:#fff7f6}
.err{color:var(--red);font-size:12.5px;margin:5px 0 0;font-weight:600}
.hint{color:var(--muted);font-size:12px;margin:5px 0 0;line-height:1.4}
.checkline{display:flex;align-items:flex-start;gap:8px;font-size:14px;font-weight:600;color:#25395c;line-height:1.4}
.checkline input{flex:0 0 auto;margin-top:3px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;background:rgba(9,20,38,.56);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  animation:fadeIn .12s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;width:100%;max-width:860px;max-height:93vh;
  display:flex;flex-direction:column;overflow:hidden;
  border-radius:16px 16px 0 0;
  box-shadow:0 -8px 40px rgba(0,0,0,.3);
}
@media (min-width:660px){
  .modal-backdrop{align-items:center;padding:22px}
  .modal{border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
}
.modal.wide{max-width:980px}
.modal header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 16px;background:var(--navy);color:#fff;flex:0 0 auto;
}
.modal header h2{font-size:16.5px;color:#fff;font-weight:700;margin:0}
.modal-body{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.modal footer{
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;
  padding:12px 16px;border-top:1px solid var(--line);background:#fbfcfe;flex:0 0 auto;
}
.confirm-text{font-size:14.5px;line-height:1.5;margin:0 0 6px;white-space:pre-line}

/* ---------- Toast ---------- */
.toast-root{
  position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:300;
  display:flex;flex-direction:column;gap:8px;width:calc(100% - 28px);max-width:430px;
  pointer-events:none;
}
.toast{
  background:#12315f;color:#fff;padding:11px 15px;border-radius:10px;
  font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);
  animation:toastIn .18s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.error{background:#a5271a}
.toast.success{background:#0a7a44}

/* ---------- Empty state ---------- */
.empty{
  text-align:center;padding:38px 20px;background:var(--card);
  border:1px dashed #cdd7e6;border-radius:var(--radius);color:var(--muted);
}
.empty .e-title{font-weight:700;color:var(--navy);font-size:15px;margin-bottom:5px}
.empty p{font-size:13.5px;margin-bottom:14px}

/* ---------- Misc ---------- */
.notice{
  display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
  background:#e8f0ff;border:1px solid #c9dbff;color:#12315f;
  border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13.5px;
}
.notice.warn{background:#fff6e5;border-color:#f0d9a8;color:#6b4700}
.notice.danger{background:#fdeceb;border-color:#f0c4bd;color:#a5271a}
.notice.purple{background:var(--purple-bg);border-color:#ddd0fb;color:#4c1d95}
.notice strong{font-weight:700}
.notice .grow{flex:1 1 220px}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;
  display:flex;gap:10px;justify-content:space-between;align-items:baseline;
}
.list-plain li:last-child{border-bottom:0}
.list-plain .li-main{min-width:0}
.list-plain .li-meta{color:var(--muted);font-size:12px;white-space:nowrap}
.sep{height:1px;background:var(--line);margin:16px 0}
.tpl-box{width:100%;min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}

/* ---------- Workflow steps ---------- */
.wf-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.wf-step{
  display:flex;align-items:flex-start;gap:12px;
  padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fafbfd;
}
.wf-step.done{background:#f0f8f3;border-color:#c9e5d4}
.wf-step.todo{background:#fffbf0;border-color:#f0dfae}
.wf-num{
  flex:0 0 28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#e2e8f2;color:#5b6b86;font-weight:800;font-size:13px;
}
.wf-step.done .wf-num{background:#0a9d5b;color:#fff}
.wf-step.todo .wf-num{background:#e0a12b;color:#fff}
.wf-body{flex:1 1 auto;min-width:0}
.wf-label{font-weight:600;color:var(--navy);font-size:14px}
.wf-detail{font-size:12.5px;margin-top:3px;line-height:1.4;word-break:break-word}
.wf-actions{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Reminders ---------- */
.reminder-list{list-style:none;margin:0;padding:0}
.reminder-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;border-radius:9px;margin-bottom:8px;
  border-left:4px solid #5b6b86;background:#f6f8fc;
}
.reminder-item.danger{border-left-color:#c0392b;background:#fdf1ef}
.reminder-item.warning{border-left-color:#e0a12b;background:#fff8e8}
.reminder-item.info{border-left-color:#2563eb;background:#eef4ff}
.reminder-item .ri-icon{font-size:16px;font-weight:800;flex:0 0 auto;line-height:1.3}
.reminder-item.danger .ri-icon{color:#c0392b}
.reminder-item.warning .ri-icon{color:#8a5a00}
.reminder-item.info .ri-icon{color:#2563eb}
.reminder-item .ri-text{flex:1 1 auto;min-width:0;font-size:13.5px;line-height:1.4}
.reminder-item .ri-text strong{color:var(--navy)}
.reminder-item .ri-actions{flex:0 0 auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---------- Workflow progress bar ---------- */
.wf-progress{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.wf-progress-track{flex:1 1 auto;height:5px;background:#eaeff7;border-radius:4px;overflow:hidden;min-width:60px}
.wf-progress-fill{height:100%;background:#0a9d5b;border-radius:4px}

/* ---------- Warnings ---------- */
.warn-list{list-style:none;margin:0;padding:0}
.warn-item{
  display:flex;gap:10px;padding:9px 12px;border-radius:9px;margin-bottom:7px;
  border-left:4px solid #5b6b86;background:#f6f8fc;font-size:13.5px;line-height:1.45;
}
.warn-item.danger{border-left-color:#c0392b;background:#fdf1ef}
.warn-item.warning{border-left-color:#e0a12b;background:#fff8e8}
.warn-item.info{border-left-color:#2563eb;background:#eef4ff}
.warn-item .wi-ico{font-weight:800;flex:0 0 auto;line-height:1.3}
.warn-item.danger .wi-ico{color:#c0392b}
.warn-item.warning .wi-ico{color:#8a5a00}
.warn-item.info .wi-ico{color:#2563eb}
.warn-item strong{color:var(--navy)}
.warn-empty{font-size:13.5px;color:var(--green);font-weight:600}

.check-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
@media (min-width:680px){.check-list{grid-template-columns:1fr 1fr;gap:4px 16px}}
.check-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 0;color:#41547a}
.check-item .ci-mark{
  flex:0 0 auto;width:18px;height:18px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;background:#eef1f6;color:#8695ae;margin-top:1px;
}
.check-item.ok .ci-mark{background:#0a9d5b;color:#fff}
.check-item.ok{color:#31456b}

.dl-grid{display:grid;grid-template-columns:1fr;margin:0}
@media (min-width:680px){.dl-grid{grid-template-columns:190px 1fr}}
.dl-grid dt{
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);padding:9px 0 0;border-top:1px solid var(--line);
}
.dl-grid dd{margin:0;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;word-break:break-word}
.dl-grid dt:first-of-type,.dl-grid dd:first-of-type{border-top:0}
@media (max-width:679px){
  .dl-grid dd{padding-top:0;border-top:0}
  .dl-grid dt{padding-top:10px}
}
.warn-count{font-weight:800}

/* ---------- Tabs ---------- */
.tabs{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;
}
.tab{

(function () {

const REMINDER_ORDER = { danger:0, warning:1, info:2 };
const WARN_ORDER = { danger:0, warning:1, info:2 };

/* ---------------------------------------------------------
   2. Small utilities
   --------------------------------------------------------- */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function uid(prefix, collection) {
  const used = new Set((collection || []).map(function (r) { return r.id; }));
  let id;
  do {
    id = prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  } while (used.has(id));
  return id;
}

function pad2(n) { return n < 10 ? '0' + n : String(n); }
function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayISO() { return isoOf(new Date()); }

function addDaysISO(iso, n) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + n);
  return isoOf(d);
}

function daysBetween(aISO, bISO) {
  const a = new Date(aISO + 'T00:00:00');
  const b = new Date(bISO + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso.slice ? iso.slice(0, 10) : iso);
  if (isNaN(d.getTime())) return esc(iso);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return esc(iso);
  return d.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function relTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const diff = Date.now() - d.getTime();
  const mins = Math.round(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' h ago';
  const days = Math.round(hrs / 24);
  if (days < 30) return days + ' d ago';
  return fmtDate(iso.slice(0, 10));
}

function money(amount, currency) {
  const a = String(amount === undefined || amount === null ? '' : amount).trim();
  if (!a) return '';
  return a + ' ' + (currency || 'PLN');
}

function simpleHash(s) {
  let h = 5381;
  const str = String(s || '');
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return 'h' + (h >>> 0).toString(36);
}

function optionsHtml(list, selected, placeholder) {
  let html = '';
  if (placeholder !== undefined) html += '<option value="">' + esc(placeholder) + '</option>';
  html += list.map(function (o) {
    const value = typeof o === 'object' ? o.id : o;
    const label = typeof o === 'object' ? o.label : o;
    return '<option value="' + esc(value) + '"' +
      (String(selected) === String(value) ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');
  return html;
}

function badge(text, kind) {
  if (!text) return '<span class="muted">—</span>';
  return '<span class="badge ' + (kind || 'gray') + '">' + esc(text) + '</span>';
}
function statusBadge(s) { return badge(s || 'Draft', STATUS_BADGE[s] || 'gray'); }
function permitBadge(v) {
  const map = { 'Yes':'green', 'No':'red', 'Pending':'amber', 'Unknown':'gray' };
  return badge(v || 'Unknown', map[v] || 'gray');
}
function verifyBadge(v) {
  const s = v || 'Not Checked';
  return badge(s, VERIFY_BADGE[s] || 'gray');
}
function draftStatusBadge(s) { return badge(s || 'Draft', DRAFT_STATUS_BADGE[s] || 'gray'); }

function findById(arr, id) { return arr.filter(function (r) { return r.id === id; })[0] || null; }

function groupCount(arr, keyFn) {
  const map = new Map();
  arr.forEach(function (r) {
    let k = keyFn(r);
    if (k === null || k === undefined || k === '') k = 'Not specified';
    map.set(k, (map.get(k) || 0) + 1);
  });
  return Array.from(map.entries()).sort(function (a, b) { return b[1] - a[1]; });
}

function unique(list) {
  const seen = new Set();
  return list.filter(function (x) {
    const k = String(x).toLowerCase().trim();
    if (!k || seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

/* CSV helpers (with formula-injection protection) */
function csvEscape(v) {
  let s = (v === null || v === undefined) ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 200);
}
function exportCSV(filename, columns, rows) {
  const head = columns.map(function (c) { return csvEscape(c.label); }).join(',');
  const body = rows.map(function (r) {
    return columns.map(function (c) {
      return csvEscape(typeof c.value === 'function' ? c.value(r) : r[c.key]);
    }).join(',');
  }).join('\r\n');
  downloadFile(filename, '\uFEFF' + head + '\r\n' + body, 'text/csv;charset=utf-8');
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(function () { return true; })
      .catch(function () { return legacyCopy(text); });
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* ---------------------------------------------------------
   3. Experience profile (canonical facts)
   --------------------------------------------------------- */
function defaultExperienceProfile() {
  return {
    summary: 'Approximately five years in warehouse and inventory operations in Saudi Arabia, working as a Storekeeper and Inventory Controller.',
    totalYears: 5,
    roles: [
      { title:'Storekeeper', employer:'', country:'Saudi Arabia', years:'' },
      { title:'Inventory Controller', employer:'', country:'Saudi Arabia', years:'' }
    ],
    systems: ['Odoo ERP'],
    skus: 'More than 2,000 SKUs',
    branches: 'Multi-branch warehouse operations',
    processes: [
      'Receiving', 'Picking', 'Packing', 'Dispatch',
      'Cycle counting', 'Monthly stock audits',
      'Inventory discrepancy investigation'
    ],
    logistics: ['Aramex', 'SMSA'],
    skills: ['Inventory accuracy', 'Stock reconciliation', '3PL coordination', 'Discrepancy investigation'],
    languages: [],
    certificates: [],
    licences: [],
    education: [],
    other: ''
  };
}

function mergeProfile(base, incoming) {
  const out = Object.assign({}, base);
  if (!incoming || typeof incoming !== 'object') return out;
  Object.keys(base).forEach(function (k) {
    const v = incoming[k];
    if (Array.isArray(base[k])) {
      out[k] = Array.isArray(v) ? v.filter(function (x) { return typeof x === 'string' && x.trim(); }) : base[k];
    } else if (typeof base[k] === 'number') {
      const n = Number(v);
      out[k] = isNaN(n) ? base[k] : n;
    } else if (typeof base[k] === 'string') {
      out[k] = (v === undefined || v === null) ? base[k] : String(v);
    }
  });
  if (Array.isArray(incoming.roles)) out.roles = incoming.roles;
  return out;
}

function profileFactLines(p) {
  const out = [];
  if (p.summary) out.push(p.summary);
  if (p.totalYears) out.push('Total experience: approximately ' + p.totalYears + ' years.');
  if (p.roles && p.roles.length) {
    out.push('Roles: ' + p.roles.map(function (r) {
      return [r.title, r.employer, r.country, r.years].filter(Boolean).join(' · ');
    }).join(' / '));
  }
  if (p.systems.length) out.push('Systems: ' + p.systems.join(', ') + '.');
  if (p.skus) out.push('Scale: ' + p.skus + '.');
  if (p.branches) out.push(p.branches + '.');
  if (p.processes.length) out.push('Processes: ' + p.processes.join(', ') + '.');
  if (p.logistics.length) out.push('3PL / carriers: ' + p.logistics.join(', ') + '.');
  if (p.skills.length) out.push('Skills: ' + p.skills.join(', ') + '.');
  if (p.languages.length) out.push('Languages: ' + p.languages.join(', ') + '.');
  else out.push('Languages: NOT RECORDED — never claim a language level.');
  if (p.certificates.length) out.push('Certificates: ' + p.certificates.join(', ') + '.');
  else out.push('Certificates: NONE RECORDED — never claim one.');
  if (p.licences.length) out.push('Licences: ' + p.licences.join(', ') + '.');
  else out.push('Licences: NONE RECORDED — never claim one.');
  if (p.education.length) out.push('Education: ' + p.education.join(', ') + '.');
  else out.push('Education: NOT RECORDED — never claim a degree.');
  if (p.other) out.push(p.other);
  return out;
}

function profileJson(p) {
  return JSON.stringify({
    summary: p.summary, totalYears: p.totalYears, roles: p.roles,
    systems: p.systems, skus: p.skus, branches: p.branches,
    processes: p.processes, logistics: p.logistics, skills: p.skills,
    languages: p.languages, certificates: p.certificates,
    licences: p.licences, education: p.education, other: p.other
  }, null, 2);
}

/* ---------------------------------------------------------
   4. Store
   --------------------------------------------------------- */
function defaultAISettings() {
  return {
    provider: 'none',
    baseUrl: 'https://api.openai.com/v1',
    model: '',
    apiKey: '',
    rememberKey: false
  };
}

function defaultSettings() {
  return {
    candidateName: '',
    candidateEmail: '',
    candidatePhone: '',
    candidateLocation: '',

    headline: 'Warehouse & Inventory Professional — 5 years experience',
    summary: '',
    targetCountries: ['Poland'],
    targetJobTitles: ['Warehouse Operative', 'Inventory Controller', 'Forklift Operator'],
    salaryAmount: '',
    salaryCurrency: 'PLN',
    salaryPeriod: 'Month',
    maxAcceptableFee: 0,
    ai: defaultAISettings(),
    experienceProfile: defaultExperienceProfile()
  };
}

function freshDB() {
  const now = new Date().toISOString();
  return {
    leads: [], applications: [], interviews: [], employers: [], documents: [], followups: [],
    aiDrafts: [], matchReports: [],
    audit: [],
    settings: defaultSettings(),
    meta: { version: SCHEMA_VERSION, createdAt: now, updatedAt: now }
  };
}

function normalizeDB(obj) {
  const base = freshDB();
  const out = {
    leads: [], applications: [], interviews: [], employers: [], documents: [], followups: [],
    aiDrafts: [], matchReports: [],
    audit: [],
    settings: Object.assign({}, base.settings, (obj && obj.settings) || {}),
    meta: Object.assign({}, base.meta, (obj && obj.meta) || {}, { version: SCHEMA_VERSION })
  };
  ['leads','applications','interviews','employers','documents','followups','aiDrafts','matchReports','audit']
    .forEach(function (k) {
      const src = obj && obj[k];
      out[k] = Array.isArray(src)
        ? src.filter(function (r) { return r && typeof r === 'object' && typeof r.id === 'string' && r.id; })
        : [];
    });
  if (!Array.isArray(out.settings.targetCountries)) out.settings.targetCountries = [];
  if (!Array.isArray(out.settings.targetJobTitles)) out.settings.targetJobTitles = [];
  if (isNaN(Number(out.settings.maxAcceptableFee))) out.settings.maxAcceptableFee = 0;

  out.settings.ai = Object.assign(defaultAISettings(), out.settings.ai || {});
  out.settings.experienceProfile = mergeProfile(defaultExperienceProfile(), out.settings.experienceProfile);

  out.employers.forEach(function (e) {
    if (VERIFY_MIGRATION[e.verificationStatus]) e.verificationStatus = VERIFY_MIGRATION[e.verificationStatus];
    if (!e.verificationStatus) e.verificationStatus = 'Not Checked';
    if (!e.recruiterName && e.contactName) e.recruiterName = e.contactName;
    if (!e.recruiterEmail && e.contactEmail) e.recruiterEmail = e.contactEmail;
    if (!e.recruiterPhone && e.contactPhone) e.recruiterPhone = e.contactPhone;
    if (!e.careersUrl && e.recruitmentPage) e.careersUrl = e.recruitmentPage;
    if (typeof e.recruiterIdentityConfirmed !== 'boolean') e.recruiterIdentityConfirmed = false;
    if (typeof e.sensitiveDocsRequest !== 'boolean') e.sensitiveDocsRequest = false;
  });
  out.leads.forEach(function (l) {
    if (VERIFY_MIGRATION[l.employerVerification]) l.employerVerification = VERIFY_MIGRATION[l.employerVerification];
    if (VERIFY_MIGRATION[l.recruiterVerification]) l.recruiterVerification = VERIFY_MIGRATION[l.recruiterVerification];
  });
  out.aiDrafts.forEach(function (d) {
    if (!DRAFT_TYPES[d.type]) d.type = 'coverLetter';
    if (['Draft','Approved','Sent','Discarded'].indexOf(d.status) === -1) d.status = 'Draft';
  });

  return out;
}

let db = null;
const runtime = { aiKey: '' };

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    return normalizeDB(parsed);
  } catch (e) {
    console.warn('JobTrack: could not read stored data.', e);
    return null;
  }
}

function saveDB() {
  db.meta.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    return true;
  } catch (e) {
    toast('Could not save: browser storage may be full or blocked.', 'error');
    return false;
  }
}

   5. Audit log
   --------------------------------------------------------- */
function auditLog(opts) {
  if (!Array.isArray(db.audit)) db.audit = [];
  const rec = {
    id: uid('aud', db.audit),
    ts: new Date().toISOString(),
    entity: opts.entity || 'application',
    entityId: opts.entityId || '',
    action: opts.action || 'Change',
    field: opts.field || '',
    from: opts.from === undefined ? '' : String(opts.from),
    to: opts.to === undefined ? '' : String(opts.to),
    note: opts.note || ''
  };
  db.audit.push(rec);
  return rec;
}

/* ---------------------------------------------------------
   6. Employer verification engine
   --------------------------------------------------------- */
function isEmployerVerified(emp) {
  if (!emp) return false;
  return emp.verificationStatus === 'Verified' &&
    String(emp.verificationNotes || '').trim().length >= 15 &&
    !!emp.verificationDate &&
    String(emp.evidenceUrl || '').trim().length > 0 &&
    !emp.sensitiveDocsRequest &&
    emp.recruitmentFee !== 'Upfront';
}

function verificationRequirements(emp) {
  const out = [];
  if (!emp) return out;
  out.push({ key:'verificationNotes', ok: String(emp.verificationNotes || '').trim().length >= 15,
    text:'Verification notes describing what you checked' });
  out.push({ key:'verificationDate', ok: !!emp.verificationDate,
    text:'Date the verification was carried out' });
  out.push({ key:'evidenceUrl', ok: String(emp.evidenceUrl || '').trim().length > 0,
    text:'Evidence URL (careers page, official registry, written confirmation)' });
  out.push({ key:'sensitiveDocsRequest', ok: !emp.sensitiveDocsRequest,
    text:'No unresolved sensitive-document request' });
  out.push({ key:'recruitmentFee', ok: emp.recruitmentFee !== 'Upfront',
    text:'No upfront recruitment fee requested' });
  return out;
}

function employerWarnings(emp) {
  const w = [];
  if (!emp) return w;
  const add = function (level, code, text, field) {
    w.push({ level: level, code: code, text: text, field: field || '' });
  };
  const threshold = Number((db && db.settings && db.settings.maxAcceptableFee) || 0);

  if (!String(emp.recruiterName || '').trim()) {
    add('warning', 'recruiter', 'Unverified recruiter — no recruiter name recorded for this employer.', 'recruiterName');
  } else if (!emp.recruiterIdentityConfirmed) {
    add('warning', 'recruiter',
      'Unverified recruiter — "' + emp.recruiterName + '" is named but their identity has not been confirmed.', 'recruiterIdentityConfirmed');
  }

  const fee = emp.recruitmentFee || 'Unknown';
  const feeAmt = Number(String(emp.recruitmentFeeAmount || '').replace(/[^0-9.]/g, '')) || 0;
  if (fee === 'Upfront') {
    if (!feeAmt) {
      add('danger', 'fee',
        'Large upfront recruitment fee requested — amount not stated. Charging candidates for a job is illegal in Poland.', 'recruitmentFee');
    } else if (feeAmt > threshold) {
      add('danger', 'fee',
        'Large upfront recruitment fee requested: ' + money(feeAmt, emp.recruitmentFeeCurrency) +
        '. Charging candidates for a job is illegal in Poland — do not pay.', 'recruitmentFeeAmount');
    } else {
      add('warning', 'fee',
        'Small upfront fee requested: ' + money(feeAmt, emp.recruitmentFeeCurrency) +
        '. Verify this is lawful before paying anything.', 'recruitmentFeeAmount');
    }
  } else if (fee === 'Deducted') {
    add('warning', 'fee',
      'Recruitment fee deducted from salary — confirm this is lawful and stated in the written contract.', 'recruitmentFee');
  } else if (fee === 'Unknown') {
    add('info', 'fee', 'Recruitment fee policy not recorded — ask in writing before signing anything.', 'recruitmentFee');
  }

  const contractType = emp.contractType || '';
  if (!contractType || contractType === 'Not specified' ||
      emp.contractClarity === 'Unclear' || emp.contractClarity === 'Not provided' ||
      emp.employmentModel === 'Unclear') {
    add('warning', 'contract',
      'Unclear employment contract — contract type, employment model or written terms are missing.',
      (!contractType || contractType === 'Not specified') ? 'contractType' : 'contractClarity');
  }

  if (!emp.workPermitSupport || emp.workPermitSupport === 'Unknown') {
    add('warning', 'permit',
      'No work-permit information recorded. Without a work permit you cannot legally take the job.', 'workPermitSupport');
  } else if (emp.workPermitSupport === 'No') {
    add('info', 'permit',
      'Employer does not support work permits — confirm you already hold the right to work in Poland.', 'workPermitSupport');
  } else if (emp.workPermitSupport === 'Pending') {
    add('info', 'permit', 'Work-permit support is not yet confirmed in writing.', 'workPermitSupport');
  }

  if (emp.sensitiveDocsRequest) {
    add('danger', 'docs',
      'Sensitive documents requested through a suspicious channel' +
      (emp.sensitiveDocsChannel ? ' (' + emp.sensitiveDocsChannel + ')' : '') +
      '. Never send passport scans or bank details over chat apps or to unverified addresses.',
      'sensitiveDocsRequest');
  }

  if (emp.employmentModel === 'Agency employment' && !String(emp.agencyRegistration || '').trim()) {
    add('warning', 'agency',
      'Agency employment recorded but no agency registration number (e.g. Polish KRAZ) was recorded.',
      'agencyRegistration');
  }

  const hasWeb = String(emp.website || '').trim() || String(emp.careersUrl || '').trim();
  if (emp.verificationStatus === 'Verified' && !isEmployerVerified(emp)) {
    add('warning', 'evidence',
      'Marked Verified but the verification evidence is incomplete — complete the requirements or change the status.',
      'verificationStatus');
  } else if (emp.verificationStatus !== 'Verified' && !String(emp.evidenceUrl || '').trim()) {
    add('info', 'evidence',
      hasWeb ? 'A company website is not verification. Record an evidence URL and what you actually checked.'
             : 'No evidence URL recorded — there is nothing backing this employer yet.',
      'evidenceUrl');
  }

  return w.sort(function (a, b) { return WARN_ORDER[a.level] - WARN_ORDER[b.level]; });
}

function employerChecklist(emp) {
  const has = function (v) { return String(v || '').trim().length > 0; };
  const directOrAgencyOk = emp.employmentModel === 'Direct employment' ||
    (emp.employmentModel === 'Agency employment' && has(emp.agencyRegistration));
  return [
    { ok: has(emp.legalName), text: 'Legal company name recorded' },
    { ok: has(emp.website), text: 'Official website recorded' },
    { ok: has(emp.careersUrl), text: 'Official careers page recorded' },
    { ok: has(emp.address), text: 'Company address recorded' },
    { ok: has(emp.recruiterName), text: 'Recruiter identity recorded' },
    { ok: !!emp.recruiterIdentityConfirmed, text: 'Recruiter identity confirmed' },
    { ok: directOrAgencyOk, text: 'Employment model clear (direct, or agency with registration)' },
    { ok: !!emp.contractType && emp.contractType !== 'Not specified' && emp.contractClarity === 'Clear', text: 'Contract type recorded and clear' },
    { ok: has(emp.salaryAmount), text: 'Salary and currency recorded' },
    { ok: emp.workPermitSupport && emp.workPermitSupport !== 'Unknown', text: 'Work-permit support confirmed' },
    { ok: emp.recruitmentFee && emp.recruitmentFee !== 'Unknown', text: 'Recruitment fee policy recorded' },
    { ok: has(emp.accommodationCost) || emp.accommodationProvided === 'No', text: 'Accommodation cost recorded' },
    { ok: has(emp.transportCost) || emp.transportProvided === 'No', text: 'Transport cost recorded' },
    { ok: !!emp.verificationDate, text: 'Verification date recorded' },
    { ok: has(emp.evidenceUrl), text: 'Evidence URL recorded' },
    { ok: String(emp.verificationNotes || '').trim().length >= 15, text: 'Verification notes recorded' },
    { ok: !emp.sensitiveDocsRequest, text: 'No sensitive-document request outstanding' }
  ];
}

function employerWarnCounts(emp) {
  const ws = employerWarnings(emp);
  return {
    all: ws.length,
    danger: ws.filter(function (w) { return w.level === 'danger'; }).length,
    warning: ws.filter(function (w) { return w.level === 'warning'; }).length,
    info: ws.filter(function (w) { return w.level === 'info'; }).length
  };
}

function warnSummaryBadge(emp) {
  const c = employerWarnCounts(emp);
  if (c.danger) return '<span class="badge red warn-count">' + c.danger + ' red flag' + (c.danger === 1 ? '' : 's') + '</span>';
  if (c.warning) return '<span class="badge amber warn-count">' + c.warning + ' warning' + (c.warning === 1 ? '' : 's') + '</span>';
  if (c.info) return '<span class="badge gray warn-count">' + c.info + ' note' + (c.info === 1 ? '' : 's') + '</span>';
  return '<span class="badge green">Clear</span>';
}

function warningsHtml(emp, limit) {
  const ws = employerWarnings(emp);
  if (!ws.length) return '<p class="warn-empty">No verification warnings.</p>';
  const shown = limit ? ws.slice(0, limit) : ws;
  return '<ul class="warn-list">' + shown.map(function (w) {
    const ico = w.level === 'danger' ? '⚠' : w.level === 'warning' ? '!' : 'ℹ';
    return '<li class="warn-item ' + esc(w.level) + '">' +
      '<span class="wi-ico">' + ico + '</span><span>' + esc(w.text) + '</span></li>';
  }).join('') + '</ul>' +
  (limit && ws.length > limit ? '<p class="small muted">+' + (ws.length - limit) + ' more warning(s).</p>' : '');
}

/* ---------------------------------------------------------
   7. Suspicious recruitment claim scanner
   --------------------------------------------------------- */
const SUSPICION_RULES = [
  { id:'fee', level:'danger', re:/registration fee|processing fee|visa fee|agency fee|placement fee|upfront (fee|payment)|security deposit|pay .{0,24}(fee|deposit)|opłata|zapłać|wpłata|kaucja/i,
    title:'Payment requested from the candidate',
    why:'Charging a candidate for recruitment is illegal in Poland. Any upfront fee, deposit or "processing" charge is a scam pattern.' },
  { id:'docs', level:'danger', re:/passport (scan|copy|photo)|scan of your (id|passport)|send .{0,30}passport|bank (account|details|number)|card number|pesel|karta pobytu|dowód osobisty/i,
    title:'Sensitive documents requested',
    why:'Passport scans, bank details and ID numbers should never be sent early or over chat apps. Share them only through an official, verified channel after a written offer.' },
  { id:'guaranteed', level:'danger', re:/guaranteed (visa|job|work permit|approval)|100% (visa|success|guarantee)|no interview (needed|required)|instant (visa|approval|job)|visa for sure/i,
    title:'Guaranteed visa or job promise',
    why:'No recruiter can guarantee a visa or a job. Work permits depend on the employer and the Polish authorities, not on an agent.' },
  { id:'channel', level:'warning', re:/whatsapp|telegram|signal|viber/i,
    title:'Chat-app-only communication',
    why:'Legitimate employers and registered agencies communicate through company email and official portals. Chat apps make fraud hard to trace.' },
  { id:'freeemail', level:'warning', re:/[a-z0-9._%-]+@(gmail|yahoo|outlook|hotmail|wp|onet|interia|op|protonmail|mail)\.(com|pl|net|me)/i,
    title:'Free email address used for HR',
    why:'A real HR department writes from a company domain. Free email addresses are a common sign of a fake recruiter.' },
  { id:'urgency', level:'warning', re:/urgent(ly)? (needed|required|hiring)|only .{0,12}(today|24 hours)|last chance|apply (immediately|now or never)|limited spots/i,
    title:'Pressure and artificial urgency',
    why:'Pressure to act within hours is designed to stop you checking the employer. Real vacancies stay open long enough to verify.' },
  { id:'nocontract', level:'warning', re:/contract (will be |to be )?(signed|provided|given) (after|later|on arrival)|no contract (needed|required)|umowa po przyjeździe/i,
    title:'Contract withheld until later',
    why:'You should see the written contract terms before travelling or paying anything. "We sign on arrival" is a common trap.' },
  { id:'notax', level:'warning', re:/no (tax|zus|insurance)|cash (only|payment)|off the books|bez umowy|na czarno/i,
    title:'Undeclared or cash-only employment',
    why:'Undeclared work gives you no legal protection, no health insurance and no basis for a residence permit.' },
  { id:'personalbank', level:'warning', re:/transfer .{0,30}(my|personal) account|western union|moneygram|revolut|paypal|bitcoin|crypto/i,
    title:'Payment to a personal or untraceable account',
    why:'Company payments go to company accounts. Requests for transfers to individuals or crypto wallets are fraud indicators.' },
  { id:'vague', level:'info', re:/well[- ]known (company|employer)|international company|great opportunity|attractive salary|excellent conditions/i,
    title:'Vague employer description',
    why:'No company name, address or registration number. Ask for the exact legal name and check it against a registry.' },
  { id:'nocost', level:'info', re:/accommodation (and|&) (food|meals) free|everything (is )?free|all expenses (paid|covered)/i,
    title:'"Everything free" claims',
    why:'Accommodation and transport always have a cost. Ask for the exact monthly deductions in writing before accepting.' }
];

function scanSuspiciousClaims(text) {
  const t = String(text || '');
  if (!t.trim()) return [];
  const out = [];
  SUSPICION_RULES.forEach(function (rule) {
    const m = t.match(rule.re);
    if (!m) return;
    const idx = m.index || 0;
    const start = Math.max(0, idx - 45);
    const end = Math.min(t.length, idx + m[0].length + 45);
    let snippet = t.slice(start, end).replace(/\s+/g, ' ').trim();
    if (start > 0) snippet = '…' + snippet;
    if (end < t.length) snippet = snippet + '…';
    out.push({
      id: rule.id, level: rule.level, title: rule.title,
      why: rule.why, evidence: m[0], snippet: snippet
    });
  });
  return out.sort(function (a, b) { return WARN_ORDER[a.level] - WARN_ORDER[b.level]; });
}

/* ---------------------------------------------------------
   8. Job suitability scoring
   --------------------------------------------------------- */
const SCORE_BANDS = [
  { min:80, key:'strong',  label:'Strong match',  cls:'strong' },
  { min:60, key:'good',    label:'Good match',    cls:'good' },
  { min:40, key:'partial', label:'Partial match', cls:'partial' },
  { min:0,  key:'weak',    label:'Weak match',    cls:'weak' }
];

function bandFor(score) {
  for (let i = 0; i < SCORE_BANDS.length; i++) if (score >= SCORE_BANDS[i].min) return SCORE_BANDS[i];
  return SCORE_BANDS[SCORE_BANDS.length - 1];
}

function analyzeJob(input) {
  const p = db.settings.experienceProfile;
  const raw = String(input.jobDescription || '');
  const hay = (' ' + raw + ' ' + (input.jobTitle || '') + ' ').toLowerCase();

  function hits(terms) {
    const found = [];
    terms.forEach(function (t) {
      if (hay.indexOf(t.toLowerCase()) !== -1) found.push(t);
    });
    return unique(found);
  }

  const criteria = [];
  function addCriterion(o) {
    const awarded = Math.round(o.max * Math.max(0, Math.min(1, o.pct)) * 10) / 10;
    criteria.push({
      id: o.id, label: o.label, max: o.max, pct: o.pct,
      awarded: awarded, reason: o.reason, matched: o.matched || [],
      rule: o.rule || ''
    });
  }

  /* 1 — Core role match (20) */
  const roleTerms = ['warehouse','storekeeper','store keeper','inventory controller','stock controller',
    'inventory','stock','magazynier','magazyn','lager','picker','packer','material handler','warehouse operative'];
  const roleHits = hits(roleTerms);
  let rolePct, roleReason;
  if (!roleHits.length) { rolePct = 0; roleReason = 'No warehouse or inventory role keywords found in the advert.'; }
  else if (roleHits.length === 1) { rolePct = 0.7; roleReason = 'Only one role keyword found (' + roleHits[0] + ') — partial signal.'; }
  else if (roleHits.length === 2) { rolePct = 0.85; roleReason = 'Two role keywords found.'; }
  else { rolePct = 1; roleReason = 'Strong role overlap.'; }
  addCriterion({ id:'role', label:'Core role match', max:20, pct:rolePct, reason:roleReason, matched:roleHits,
    rule:'0 keywords = 0% · 1 = 70% · 2 = 85% · 3+ = 100%' });

  /* 2 — Inventory systems / ERP (15) */
  const erpTerms = ['odoo','erp','wms','sap','warehouse management system','inventory system','subiekt','dynamics','netsuite'];
  const erpHits = hits(erpTerms);
  let erpPct, erpReason;
  const profileHasOdoo = p.systems.some(function (s) { return /odoo/i.test(s); });
  const mentionsOdoo = erpHits.indexOf('odoo') !== -1;
  const mentionsGeneric = erpHits.indexOf('erp') !== -1 || erpHits.indexOf('wms') !== -1 ||
                          erpHits.indexOf('warehouse management system') !== -1 || erpHits.indexOf('inventory system') !== -1;
  if (!erpHits.length) { erpPct = 0.6; erpReason = 'The advert does not specify an ERP or WMS — your Odoo experience is still relevant but not a differentiator.'; }
  else if (mentionsOdoo && profileHasOdoo) { erpPct = 1; erpReason = 'The advert mentions Odoo, which is in your profile.'; }
  else if (mentionsGeneric) {
    erpPct = profileHasOdoo ? 0.85 : 0.4;
    erpReason = profileHasOdoo ? 'The advert asks for general ERP/WMS experience — your Odoo background transfers.'
                                : 'The advert asks for ERP/WMS experience, but no ERP is recorded in your profile.';
  } else {
    erpPct = profileHasOdoo ? 0.5 : 0.2;
    erpReason = 'The advert asks for ' + erpHits.slice(0, 3).join(', ') +
      '. Your recorded system is ' + (p.systems.join(', ') || 'none') + ' — transferable but confirm.';
  }
  addCriterion({ id:'erp', label:'Inventory systems / ERP', max:15, pct:erpPct, reason:erpReason, matched:erpHits,
    rule:'Exact Odoo match = 100% · generic ERP/WMS = 85% · different ERP = 50% · not mentioned = 60%' });

  /* 3 — Inventory control processes (15) */
  const icTerms = ['cycle count','cycle counting','stock audit','stocktake','stock take','inventory audit',
    'inventory control','reconciliation','discrepancy','shrinkage','stock accuracy','inwentaryzacja','inventory accuracy'];
  const icHits = hits(icTerms);
  let icPct, icReason;
  if (!icHits.length) { icPct = 0.5; icReason = 'The advert does not mention inventory-control processes — treated as neutral.'; }
  else if (icHits.length === 1) { icPct = 0.85; icReason = 'One inventory-control process mentioned.'; }
  else { icPct = 1; icReason = 'Multiple inventory-control processes mentioned.'; }
  addCriterion({ id:'inventory', label:'Inventory control processes', max:15, pct:icPct, reason:icReason, matched:icHits,
    rule:'Not mentioned = 50% (neutral) · 1 = 85% · 2+ = 100%' });

  /* 4 — Warehouse operations (15) */
  const woTerms = ['receiving','goods in','goods-in','picking','packing','dispatch','shipping','put-away',
    'putaway','inbound','outbound','order fulfillment','order fulfilment','kompletacja','wysyłka'];
  const woHits = hits(woTerms);
  let woPct, woReason;
  if (!woHits.length) { woPct = 0.5; woReason = 'The advert does not list warehouse operations — treated as neutral.'; }
  else if (woHits.length <= 2) { woPct = 0.9; woReason = 'Several core warehouse operations listed.'; }
  else { woPct = 1; woReason = 'Broad warehouse-operations overlap.'; }
  addCriterion({ id:'operations', label:'Warehouse operations', max:15, pct:woPct, reason:woReason, matched:woHits,
    rule:'Not mentioned = 50% · 1–2 = 90% · 3+ = 100%' });

  /* 5 — 3PL / carrier coordination (10) */
  const tplTerms = ['aramex','smsa','3pl','third party logistics','third-party logistics','courier','carrier',
    'freight','dhl','dpd','gls','ups','fedex','inpost','spedycja'];
  const tplHits = hits(tplTerms);
  const profileCarrierHit = tplHits.filter(function (t) {
    return p.logistics.some(function (l) { return l.toLowerCase() === t.toLowerCase(); });
  });
  let tplPct, tplReason;
  if (profileCarrierHit.length) { tplPct = 1; tplReason = 'The advert names a carrier in your profile (' + profileCarrierHit.join(', ') + ').'; }
  else if (tplHits.length) { tplPct = 0.75; tplReason = 'The advert mentions logistics/courier work (' + tplHits.slice(0, 3).join(', ') + ') — you have 3PL coordination experience with ' + (p.logistics.join(', ') || 'other carriers') + '.'; }
  else { tplPct = 0.5; tplReason = 'The advert does not mention 3PL or carrier coordination — treated as neutral.'; }
  addCriterion({ id:'logistics', label:'3PL / carrier coordination', max:10, pct:tplPct, reason:tplReason, matched:tplHits,
    rule:'Named carrier in profile = 100% · other carrier = 75% · not mentioned = 50%' });

  /* 6 — Scale / complexity (10) */
  const scaleTerms = ['sku','multi-branch','multiple branches','high volume','high-volume','fast-paced',
    'large warehouse','fmcg','oddziały','high sku'];
  const scaleHits = hits(scaleTerms);
  let scalePct, scaleReason;
  if (!scaleHits.length) { scalePct = 0.5; scaleReason = 'No scale indicators in the advert — treated as neutral.'; }
  else if (scaleHits.length === 1) { scalePct = 0.8; scaleReason = 'One scale indicator mentioned.'; }
  else { scalePct = 1; scaleReason = 'Multiple scale indicators mentioned — matches your 2,000+ SKU, multi-branch background.'; }
  addCriterion({ id:'scale', label:'Scale / complexity', max:10, pct:scalePct, reason:scaleReason, matched:scaleHits,
    rule:'Not mentioned = 50% · 1 = 80% · 2+ = 100%' });

  /* 7 — Experience duration (10) */
  const durMatch = raw.match(/(\d{1,2})\s*(?:\+|plus)?\s*(?:years?|yrs?|lat)/i);
  let durPct, durReason, durMissing = null;
  if (!durMatch) { durPct = 0.7; durReason = 'No minimum years stated — treated as neutral.'; }
  else {
    const required = Number(durMatch[1]);
    if (p.totalYears >= required) { durPct = 1; durReason = 'Advert asks for ' + required + ' year(s); your profile records approximately ' + p.totalYears + '.'; }
    else if (p.totalYears >= required - 1) {
      durPct = 0.5;
      durReason = 'Advert asks for ' + required + ' year(s); your profile records approximately ' + p.totalYears + ' — close but slightly short.';
      durMissing = { id:'years', label:'Minimum ' + required + ' years of experience', evidence:'Advert states ' + durMatch[0], severity:'medium' };
    } else {
      durPct = 0;
      durReason = 'Advert asks for ' + required + ' year(s); your profile records approximately ' + p.totalYears + '.';
      durMissing = { id:'years', label:'Minimum ' + required + ' years of experience', evidence:'Advert states ' + durMatch[0], severity:'high' };
    }
  }
  addCriterion({ id:'duration', label:'Experience duration', max:10, pct:durPct, reason:durReason, matched: durMatch ? [durMatch[0]] : [],
    rule:'Not stated = 70% · enough years = 100% · 1 year short = 50% · otherwise 0%' });

  /* 8 — Language requirement (5) */
  const langMap = [
    { key:'english', terms:['english','angielski'] },
    { key:'polish',  terms:['polish','polski'] },
    { key:'german',  terms:['german','deutsch','niemiecki'] }
  ];
  const mentionedLangs = [];
  langMap.forEach(function (l) {
    if (l.terms.some(function (t) { return hay.indexOf(t) !== -1; })) mentionedLangs.push(l.key);
  });
  const profileLangs = p.languages.map(function (l) { return l.toLowerCase(); });
  let langPct, langReason;
  const langMissing = [];
  if (!mentionedLangs.length) { langPct = 1; langReason = 'The advert does not state a language requirement.'; }
  else {
    const matched = mentionedLangs.filter(function (l) {
      return profileLangs.some(function (pl) { return pl.indexOf(l) !== -1; });
    });
    langPct = matched.length / mentionedLangs.length;
    langReason = matched.length ? 'Language requirement met for: ' + matched.join(', ') + '.'
      : 'The advert requires ' + mentionedLangs.join(', ') + ', which is not recorded in your profile.';
    mentionedLangs.forEach(function (l) {
      if (matched.indexOf(l) === -1) {
        langMissing.push({ id:'lang-' + l, label: l.charAt(0).toUpperCase() + l.slice(1) + ' language proficiency',
          evidence:'Advert mentions ' + l, severity:'high' });
      }
    });
  }
  addCriterion({ id:'language', label:'Language requirement', max:5, pct:langPct, reason:langReason, matched: mentionedLangs,
    rule:'Not required = 100% · required and recorded = 100% · required and not recorded = 0%' });

  const total = Math.round(criteria.reduce(function (s, c) { return s + c.awarded; }, 0));
  const band = bandFor(total);

  const missing = [];
  langMissing.forEach(function (m) { missing.push(m); });
  if (durMissing) missing.push(durMissing);

  const probes = [
    { id:'forklift', label:'Forklift licence (UDT / wózki widłowe)',
      re:/forklift|udt|wóz(ka|ek)? widłow|widłow/i,
      has: function () { return p.licences.some(function (l) { return /forklift|udt|widłow/i.test(l); }); },
      advice:'Add it to your profile only if you genuinely hold it. Otherwise ask whether the employer provides UDT training.' },
    { id:'driving', label:'Driving licence',
      re:/driving licen[cs]e|driver'?s licen[cs]e|prawo jazdy/i,
      has: function () { return p.licences.some(function (l) { return /driv|prawo jazdy/i.test(l); }); },
      advice:'Only add it if you hold one. Do not claim a category you do not have.' },
    { id:'haccp', label:'HACCP / food-safety training',
      re:/haccp|food safety|higien/i,
      has: function () { return p.certificates.some(function (c) { return /haccp|food safety/i.test(c); }); },
      advice:'Ask whether the employer provides HACCP training on site.' },
    { id:'bhp', label:'BHP / health-and-safety training',
      re:/\bbhp\b|health and safety|occupational health/i,
      has: function () { return p.certificates.some(function (c) { return /bhp|health and safety/i.test(c); }); },
      advice:'In Poland BHP training is normally arranged by the employer at the start of employment.' },
    { id:'firstaid', label:'First-aid certificate',
      re:/first aid|pierwsza pomoc/i,
      has: function () { return p.certificates.some(function (c) { return /first aid/i.test(c); }); },
      advice:'Only add it if you hold a current certificate.' },
    { id:'education', label:'Formal education requirement',
      re:/bachelor|master'?s|degree|diploma|wyższe|licencjat/i,
      has: function () { return p.education.length > 0; },
      advice:'No education is recorded in your profile. If you have one, add it. If not, address it briefly rather than hiding it.' },
    { id:'othererp', label:'A specific ERP other than Odoo',
      re:/\b(sap|dynamics|netsuite|subiekt)\b/i,
      has: function () { return false; },
      advice:'Your recorded system is Odoo. Emphasise transferable ERP logic rather than claiming experience you do not have.' }
  ];

  probes.forEach(function (pr) {
    if (!pr.re.test(raw)) return;
    if (pr.has()) return;
    const m = raw.match(pr.re);
    missing.push({
      id: pr.id, label: pr.label,
      evidence: 'Advert mentions "' + (m ? m[0] : pr.label) + '"',
      severity: 'medium', advice: pr.advice
    });
  });

  if (/work permit|right to work|legal(ly)? (work|employ)|visa/i.test(raw)) {
    missing.push({
      id:'permit', label:'Right to work in Poland',
      evidence:'Advert references work authorisation',
      severity:'info',
      advice:'This is not a qualification — it is a legal status. Confirm in writing whether the employer supports a work permit before applying.'
    });
  }

  const suspicious = scanSuspiciousClaims(raw);
  const cv = recommendCv(input.jobTitle, raw);

  return {
    id: null, createdAt: null,
    applicationId: input.applicationId || '',
    leadId: input.leadId || '',
    company: input.company || '',
    jobTitle: input.jobTitle || '',
    jobDescription: raw,
    score: total,
    band: band.key,
    bandLabel: band.label,
    criteria: criteria,
    missing: missing,
    suspicious: suspicious,
    cv: cv,
    profileSnapshot: {
      totalYears: p.totalYears,
      systems: p.systems.slice(),
      logistics: p.logistics.slice(),
      languages: p.languages.slice()
    }
  };
}

function recommendCv(jobTitle, jobDescription) {
  const cvs = db.documents.filter(function (d) { return d.category === 'CV'; });
  if (!cvs.length) {
    return {
      recommendedId:'', recommendedLabel:'',
      reason:'No CVs are registered yet. Add your CV versions in Documents so JobTrack can recommend one.',
      alternatives:[]
    };
  }

  const jd = ((jobTitle || '') + ' ' + (jobDescription || '')).toLowerCase();
  const signalTerms = ['warehouse','inventory','stock','controller','operative','storekeeper','odoo',
    'erp','logistics','picker','packer','dispatch','receiving','audit','cycle count'];

  const jobSignals = signalTerms.filter(function (t) { return jd.indexOf(t) !== -1; });

  const scored = cvs.map(function (cv) {
    const text = ((cv.filename || '') + ' ' + (cv.version || '') + ' ' + (cv.notes || '')).toLowerCase();
    const matched = jobSignals.filter(function (t) { return text.indexOf(t) !== -1; });
    return { cv: cv, hits: matched.length, matched: matched };
  }).sort(function (a, b) {
    if (b.hits !== a.hits) return b.hits - a.hits;
    return String(b.cv.updatedAt || '').localeCompare(String(a.cv.updatedAt || ''));
  });

  const best = scored[0];
  let reason;
  if (best.hits > 0) reason = 'Matches the job signals: ' + best.matched.slice(0, 5).join(', ') + '.';
  else reason = 'No CV filename or note matches this advert. The most recently updated CV is suggested — consider creating a tailored version.';

  return {
    recommendedId: best.cv.id,
    recommendedLabel: best.cv.filename + (best.cv.version ? ' (' + best.cv.version + ')' : ''),
    reason: reason,
    alternatives: scored.slice(1, 4).map(function (s) {
      return { id: s.cv.id, label: s.cv.filename + (s.cv.version ? ' (' + s.cv.version + ')' : ''), hits: s.hits };
    })
  };
}

/* ---------------------------------------------------------
   9. Claims auditor
   --------------------------------------------------------- */
function auditDraftClaims(text) {
  const p = db.settings.experienceProfile;
  const t = String(text || '');
  const issues = [];
  if (!t.trim()) return issues;

  const profileLangs = p.languages.map(function (l) { return l.toLowerCase(); });
  const langWords = ['english','polish','german','deutsch','polski','angielski','niemiecki'];
  const levelRe = /\b(fluent|native|bilingual|proficient|advanced|intermediate|basic|a2|b1|b2|c1|c2)\b/i;

  langWords.forEach(function (lw) {
    const idx = t.toLowerCase().indexOf(lw);
    if (idx === -1) return;
    const window = t.slice(Math.max(0, idx - 60), Math.min(t.length, idx + lw.length + 60));
    if (!levelRe.test(window)) return;
    const recorded = profileLangs.some(function (pl) { return pl.indexOf(lw) !== -1 || lw.indexOf(pl) !== -1; });
    if (!recorded) {
      issues.push({
        level:'danger', label:'Language proficiency claim',
        evidence: window.replace(/\s+/g,' ').trim(),
        fix:'No language level is recorded in your profile. Remove the level, or add it to your profile only if you can evidence it.'
      });
    }
  });

  if (/\b(certified|certificate|certification|licen[cs]ed|licence holder)\b/i.test(t)) {
    const hasAny = p.certificates.length + p.licences.length > 0;
    if (!hasAny) {
      const m = t.match(/\b(certified|certificate|certification|licen[cs]ed|licence holder)\b[^.]{0,60}/i);
      issues.push({
        level:'danger', label:'Certification claim',
        evidence: m ? m[0].replace(/\s+/g,' ').trim() : 'certification wording',
        fix:'No certificates or licences are recorded in your profile. Remove the claim or add the document if you genuinely hold it.'
      });
    }
  }

  if (/\b(bachelor|master'?s|degree|diploma|university|college|b\.?sc|m\.?sc)\b/i.test(t) && !p.education.length) {
    const m = t.match(/\b(bachelor|master'?s|degree|diploma|university|college)\b[^.]{0,60}/i);
    issues.push({
      level:'danger', label:'Education claim',
      evidence: m ? m[0].replace(/\s+/g,' ').trim() : 'education wording',
      fix:'No education is recorded in your profile. Remove the claim or add it to your profile if true.'
    });
  }

  const yearRe = /\b(\d{1,2})\+?\s*(?:years?|yrs?)\b/gi;
  let ym;
  while ((ym = yearRe.exec(t)) !== null) {
    const n = Number(ym[1]);
    if (!isNaN(n) && n > Number(p.totalYears || 0)) {
      issues.push({
        level:'warning', label:'Experience length exceeds your profile',
        evidence: ym[0],
        fix:'Your profile records approximately ' + p.totalYears + ' years. Change the figure to match, or update your profile.'
      });
    }
  }

  const skuRe = /\b([\d][\d,\.]{1,})\+?\s*(?:skus?|products?|items?)\b/gi;
  let sm;
  while ((sm = skuRe.exec(t)) !== null) {
    const digits = sm[1].replace(/[,\.]/g, '');
    const profileDigits = String(p.skus || '').replace(/[,\.]/g, '');
    if (profileDigits.indexOf(digits) === -1) {
      issues.push({
        level:'warning', label:'Figure not in your profile',
        evidence: sm[0],
        fix:'Your profile records "' + (p.skus || 'no SKU figure') + '". Use that figure or add the real one to your profile.'
      });
    }
  }

  if (/\bauthori[sz]ed to work\b|\bright to work\b|\bwork permit (holder|granted|approved)\b|\bhold a (valid )?work permit\b/i.test(t)) {
    issues.push({
      level:'warning', label:'Work-authorisation claim',
      evidence: (t.match(/\bauthori[sz]ed to work\b[^.]{0,60}|\bright to work\b[^.]{0,60}|\bwork permit (holder|granted|approved)\b[^.]{0,60}/i) || [''])[0].replace(/\s+/g,' ').trim(),
      fix:'Never claim work authorisation you do not hold. Say instead that you would require a work permit and ask whether the role supports one.'
    });
  }

  const erpClaim = t.match(/\b(sap|dynamics|netsuite|subiekt)\b/i);
  if (erpClaim && !p.systems.some(function (s) { return s.toLowerCase().indexOf(erpClaim[1].toLowerCase()) !== -1; })) {
    issues.push({
      level:'warning', label:'ERP system not in your profile',
      evidence: erpClaim[0],
      fix:'Your recorded system is ' + (p.systems.join(', ') || 'none') + '. Emphasise transferable skills instead of naming a system you have not used.'
    });
  }

  const seen = new Set();
  return issues.filter(function (i) {
    const k = i.label + '|' + i.evidence;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

   --------------------------------------------------------- */
function profileSentenceRoles() {
  const p = db.settings.experienceProfile;
  const titles = unique((p.roles || []).map(function (r) { return r.title; }).filter(Boolean));
  if (!titles.length) return 'in warehouse and inventory operations';
  if (titles.length === 1) return 'as a ' + titles[0];
  return 'as a ' + titles.slice(0, -1).join(', ') + ' and ' + titles[titles.length - 1];
}

function listSentence(items) {
  const list = unique((items || []).filter(Boolean));
  if (!list.length) return '';
  if (list.length === 1) return list[0];
  if (list.length === 2) return list[0] + ' and ' + list[1];
  return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
}

function buildCoverLetter(ctx) {
  const s = db.settings;
  const p = s.experienceProfile;
  const report = ctx.report || null;

  const salutation = ctx.recruiterName ? ('Dear ' + ctx.recruiterName + ',') : 'Dear Hiring Manager,';
  const company = ctx.company || 'your company';
  const role = ctx.jobTitle || 'the advertised position';

  const paras = [];
  paras.push(salutation);
  paras.push('');
  paras.push('I am writing to apply for the ' + role + ' position at ' + company + '.');

  const years = p.totalYears || 5;
  paras.push('I have approximately ' + years + ' years of experience ' + profileSentenceRoles() +
    ' in ' + (p.roles && p.roles[0] && p.roles[0].country ? p.roles[0].country : 'Saudi Arabia') +
    ', and I would like to bring that experience to your team.');

  const systemLine = p.systems.length
    ? 'In my day-to-day work I use ' + p.systems.join(' and ') + ', handling ' +
      (p.skus || 'a large number of SKUs') + ' across ' + (p.branches || 'multiple warehouse locations') + '. '
    : '';
  const processLine = p.processes.length
    ? 'My responsibilities cover ' + listSentence(p.processes) + '. '
    : '';
  paras.push(systemLine + processLine);

  if (p.logistics.length) {
    paras.push('I regularly coordinate with third-party logistics providers such as ' +
      listSentence(p.logistics) + ' for inbound and outbound movements, and I follow up on ' +
      'delays and discrepancies directly with them.');
  }

  if (report && report.criteria && report.criteria.length) {
    const strong = report.criteria.filter(function (c) { return c.pct >= 0.85; })
      .map(function (c) { return c.label.toLowerCase(); });
    if (strong.length) {
      paras.push('Your advert emphasises ' + listSentence(strong.slice(0, 3)) +
        ', which aligns closely with my daily work.');
    }
  }

  const loc = (s.candidateLocation || '').trim();
  if (loc) {
    paras.push('I am currently based in ' + loc + ' and would require a work permit to take up employment in ' +
      ((s.targetCountries && s.targetCountries[0]) || 'Poland') +
      '. I would welcome the opportunity to discuss whether this role includes permit support.');
  }

  paras.push('I would be glad to discuss how my experience matches your requirements. ' +
    'Thank you for your time and consideration.');
  paras.push('');
  paras.push('Kind regards,');
  paras.push(s.candidateName || '[Your name]');
  const contact = [s.candidateEmail, s.candidatePhone].filter(Boolean).join(' | ');
  paras.push(contact || '[Your email] | [Your phone]');

  return {
    subject: 'Application for ' + role + ' — ' + (s.candidateName || '[Your name]'),
    body: paras.join('\n')
  };
}
