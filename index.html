function generateInterviewForApp(appId) {
  const app = findById(db.applications, appId);
  if (!app) { toast('Select an application first.', 'error'); return; }

  const latestReport = db.matchReports
    .filter(function (r) { return r.applicationId === app.id; })
    .sort(function (a, b) { return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); })[0] || null;

  const built = buildInterviewPrep({ company: app.company, jobTitle: app.jobTitle, report: latestReport });

  const p = db.settings.experienceProfile;
  const draft = createDraft({
    type: 'interviewPrep',
    title: 'Interview prep — ' + app.jobTitle + ' at ' + app.company,
    subject: built.subject, body: built.body,
    applicationId: app.id, reportId: latestReport ? latestReport.id : '',
    provider: 'template', facts: profileFactLines(p).slice(0, 6)
  });
  render();
  openDraftEditor(draft.id);
}

async function improveDraftWithAI(draftId) {
  const d = findById(db.aiDrafts, draftId);
  if (!d) return;
  if (!aiConfigured()) { toast('AI is not configured.', 'error'); return; }

  const report = d.reportId ? findById(db.matchReports, d.reportId) : null;
  const taskMap = { coverLetter:'coverLetter', recruiterEmail:'recruiterEmail',
                    followUp:'followUp', interviewPrep:'interviewPrep' };
  const task = taskMap[d.type] || 'coverLetter';

  const prompt = buildAIPrompt(task, {
    company: report ? report.company : '',
    jobTitle: report ? report.jobTitle : '',
    jobDescription: report ? report.jobDescription : '',
    report: report, subtype: d.subtype, recruiterName: ''
  });

  openModal({
    title: 'Rewriting with AI…',
    body: '<p class="small muted">Sending the prompt to your configured provider. This can take a few seconds.</p>' +
          '<div class="notice"><div class="grow">Your profile facts and the job description are sent to the provider. ' +
          'Nothing else leaves your browser.</div></div>'
  });

  let text;
  try { text = await callAI(prompt, { maxTokens: 1500 }); }
  catch (err) { closeModal(); toast(err.message || 'AI request failed.', 'error'); return; }

  closeModal();

  confirmDialog({
    title: 'Replace draft body?',
    message: 'The AI response will replace the current body. You can still edit it afterwards, and the draft returns to unapproved status.',
    confirmLabel: 'Replace body', danger: false,
    onConfirm: function () {
      updateDraft(d.id, {
        body: text, provider: 'ai',
        model: (db.settings.ai || {}).model || '',
        promptUsed: prompt, status: 'Draft'
      });
      auditLog({ entity: 'draft', entityId: d.id, action: 'Draft rewritten with AI',
        note: (db.settings.ai || {}).model || '' });
      saveDB();
      render();
      openDraftEditor(d.id);
      const issues = auditDraftClaims(text);
      if (issues.length) toast('AI draft created — ' + issues.length + ' claim(s) need checking.', 'error');
      else toast('AI draft created. Review every line before approving.', 'success');
    }
  });
}

function buildActivity(limit) {
  const items = [];
  function push(rec, html) { items.push({ date: rec.updatedAt || rec.createdAt || '', html: html }); }
  db.leads.forEach(function (l) {
    push(l, '<strong>' + esc(l.company || 'Lead') + '</strong> — ' + esc(l.jobTitle || '') +
      ' <span class="muted small">(lead)</span>');
  });
  db.applications.forEach(function (a) {
    push(a, '<strong>' + esc(a.company || 'Application') + '</strong> — ' + esc(a.jobTitle || '') +
      ' ' + statusBadge(a.status));
  });
  db.interviews.forEach(function (i) {
    push(i, 'Interview: <strong>' + esc(i.employer || '') + '</strong> — ' + esc(i.jobTitle || ''));
  });
  db.employers.forEach(function (e) {
    push(e, 'Employer: <strong>' + esc(e.legalName || '') + '</strong> ' + verifyBadge(e.verificationStatus));
  });
  db.aiDrafts.forEach(function (d) {
    push(d, 'Draft: <strong>' + esc(d.title || '') + '</strong> ' + draftStatusBadge(d.status));
  });
  return items.filter(function (i) { return i.date; })
    .sort(function (a, b) { return b.date.localeCompare(a.date); })
    .slice(0, limit);
}

function buildUpcomingActions(limit) {
  const today = todayISO();
  const horizon = addDaysISO(today, 30);
  const out = [];

  db.applications.forEach(function (a) {
    if (!a.followUpDate) return;
    if (ACTIVE_STATUSES.indexOf(a.status) === -1) return;
    if (a.followUpDate > horizon) return;
    const diff = daysBetween(today, a.followUpDate);
    let when;
    if (diff < 0) when = Math.abs(diff) + ' day' + (Math.abs(diff) === 1 ? '' : 's') + ' overdue';
    else if (diff === 0) when = 'Today';
    else when = 'In ' + diff + ' day' + (diff === 1 ? '' : 's');
    out.push({ date: a.followUpDate, when: when,
      html: 'Follow up: <strong>' + esc(a.company) + '</strong> — ' + esc(a.jobTitle) });
  });

  db.interviews.forEach(function (i) {
    if (!i.date || i.date < today || i.date > horizon) return;
    const diff = daysBetween(today, i.date);
    out.push({ date: i.date, when: diff === 0 ? 'Today' : 'In ' + diff + ' day' + (diff === 1 ? '' : 's'),
      html: 'Interview: <strong>' + esc(i.employer) + '</strong> — ' + esc(i.jobTitle || '') +
        (i.time ? ' at ' + esc(i.time) : '') });
  });

  return out.sort(function (a, b) { return a.date.localeCompare(b.date); }).slice(0, limit);
}

function weeklyApplications() {
  const today = new Date(todayISO() + 'T00:00:00');
  const dow = (today.getDay() + 6) % 7;
  const startCurrent = new Date(today);
  startCurrent.setDate(today.getDate() - dow);

  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const start = new Date(startCurrent);
    start.setDate(startCurrent.getDate() - 7 * i);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    const s = isoOf(start), e = isoOf(end);
    const count = db.applications.filter(function (a) {
      return a.applicationDate && a.applicationDate >= s && a.applicationDate <= e;
    }).length;
    weeks.push({ label: s.slice(5), count: count });
  }
  return weeks;
}

    rows.map(function (a) {
      let followCell = '—';
      if (a.followUpDate) {
        const diff = daysBetween(today, a.followUpDate);
        let note = '';
        if (diff < 0) note = '<div class="small" style="color:var(--red);font-weight:700">' + Math.abs(diff) + 'd overdue</div>';

      const wf = workflowProgress(a);

/* ---------------- Follow-ups ---------------- */
function renderFollowups() {
  const today = todayISO();
  const pool = db.applications.filter(function (a) {
    return a.followUpDate && ['Draft','Withdrawn','Closed','Rejected'].indexOf(a.status) === -1;
  });
  const overdue = pool.filter(function (a) { return a.followUpDate < today; })
    .sort(function (a, b) { return a.followUpDate.localeCompare(b.followUpDate); });
  const dueToday = pool.filter(function (a) { return a.followUpDate === today; });
  const upcoming = pool.filter(function (a) { return a.followUpDate > today; })
    .sort(function (a, b) { return a.followUpDate.localeCompare(b.followUpDate); });
  const history = db.followups.slice().sort(function (a, b) {
    return String(b.date || '').localeCompare(String(a.date || '')) ||
           String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
  });

  function followRow(a) {
    const diff = daysBetween(today, a.followUpDate);
    let when = fmtDate(a.followUpDate);
    if (diff < 0) when += ' · ' + Math.abs(diff) + ' day' + (Math.abs(diff) === 1 ? '' : 's') + ' overdue';
    else if (diff === 0) when += ' · due today';
    else when += ' · in ' + diff + ' day' + (diff === 1 ? '' : 's');

    return '<tr><td data-label="Company"><strong>' + esc(a.company) + '</strong></td>' +
      '<td data-label="Job title">' + esc(a.jobTitle) + '</td>' +
      '<td data-label="Status">' + statusBadge(a.status) + '</td>' +
      '<td data-label="Follow-up">' + esc(when) + '</td>' +
      '<td class="row-actions">' +
        '<button type="button" class="btn btn-sm btn-primary" data-action="log-followup-for" data-id="' + esc(a.id) + '">Log</button>' +
        '<button type="button" class="btn btn-sm btn-purple" data-action="draft-followup-for" data-id="' + esc(a.id) + '">Draft message</button>' +
        '<button type="button" class="btn btn-sm btn-outline" data-action="open-workflow" data-id="' + esc(a.id) + '">Workflow</button>' +
      '</td></tr>';
  }

  function section(title, list, emptyText) {
    return '<div class="card"><h2>' + esc(title) + ' <span class="count">(' + list.length + ')</span></h2>' +
      (list.length
        ? '<div class="table-wrap"><table><thead><tr><th>Company</th><th>Job title</th><th>Status</th>' +
          '<th>Follow-up</th><th>Actions</th></tr></thead><tbody>' + list.map(followRow).join('') + '</tbody></table></div>'
        : '<p class="muted small">' + esc(emptyText) + '</p>') + '</div>';
  }

  return '<div class="page-head">' +
    '<div><h1>Follow-ups</h1><p class="sub">JobTrack never sends email — you stay in control.</p></div>' +
    '<button type="button" class="btn btn-primary" data-action="log-followup">+ Log follow-up</button></div>' +
  '<div class="notice"><div class="grow"><strong>Automatic suggestion:</strong> when you save an application with a date ' +
    'but no follow-up date, JobTrack sets the follow-up to <strong>7 calendar days later</strong>.</div></div>' +
  section('Overdue', overdue, 'Nothing overdue. Well done.') +
  section('Due today', dueToday, 'Nothing due today.') +
  section('Upcoming', upcoming, 'No upcoming follow-ups scheduled.') +
  '<div class="card"><h2>Follow-up history <span class="count">(' + history.length + ')</span></h2>' +
    (history.length
      ? '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Application</th><th>Method</th>' +
        '<th>Notes</th><th>Actions</th></tr></thead><tbody>' + history.map(function (f) {
          const app = findById(db.applications, f.applicationId);
          const label = app ? app.company + ' — ' + app.jobTitle : 'Deleted application';
          return '<tr><td data-label="Date">' + esc(fmtDate(f.date)) + '</td>' +
            '<td data-label="Application"><strong>' + esc(label) + '</strong></td>' +
            '<td data-label="Method">' + badge(f.method || '—', 'gray') + '</td>' +
            '<td data-label="Notes">' + esc(f.notes || '—') + '</td>' +
            '<td class="row-actions"><button type="button" class="btn btn-sm btn-danger" data-action="delete-followup" data-id="' + esc(f.id) + '">Delete</button></td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<p class="muted small">No follow-ups logged yet.</p>') +
  '</div>';
}

  const byTitle = groupCount(apps, function (a) { return a.jobTitle; });

  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    const count = apps.filter(function (a) {
      return a.applicationDate && a.applicationDate.slice(0, 7) === key;
    }).length;
    months.push({ label: d.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }), count: count });
  }

  function barList(entries, max) {
    if (!entries.length) return '<p class="muted small">No data yet.</p>';
    return entries.map(function (e) {
      const width = e.count ? Math.max(4, Math.round((e.count / max) * 100)) : 0;
      return '<div class="bar-row"><div class="bar-label" title="' + esc(e.label) + '">' + esc(e.label) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + width + '%"></div></div>' +
        '<div class="bar-val">' + e.count + '</div></div>';
    }).join('');
  }

  const maxCountry = Math.max.apply(null, byCountry.map(function (e) { return e[1]; }).concat([1]));
  const maxCompany = Math.max.apply(null, byCompany.map(function (e) { return e[1]; }).concat([1]));
  const maxTitle = Math.max.apply(null, byTitle.map(function (e) { return e[1]; }).concat([1]));
  const maxWeek = Math.max.apply(null, weeks.map(function (w) { return w.count; }).concat([1]));
  const maxMonth = Math.max.apply(null, months.map(function (m) { return m.count; }).concat([1]));

  const matchRows = db.matchReports.slice()
    .sort(function (a, b) { return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); })
    .slice(0, 15);

  const verifyRows = db.employers.map(function (e) {
    const c = employerWarnCounts(e);
    return {
      company: e.legalName || 'Unnamed',
      status: e.verificationStatus || 'Not Checked',
      evidenceComplete: isEmployerVerified(e) ? 'Yes' : 'No',
      danger: c.danger, warnings: c.warning,
      permit: e.workPermitSupport || 'Unknown',
      fee: e.recruitmentFee || 'Unknown',
      checked: e.verificationDate || ''
    };
  }).sort(function (a, b) { return b.danger - a.danger || b.warnings - a.warnings; });

  return '<div class="page-head">' +
    '<div><h1>Reports</h1><p class="sub">Understand your conversion, your matches, and which employers are risky.</p></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button type="button" class="btn btn-outline" data-action="export-apps-csv">Export applications</button>' +
      '<button type="button" class="btn btn-outline" data-action="export-employers-csv">Export employers</button>' +
    '</div></div>' +
  '<div class="card"><h2>Job match history <span class="count">(' + db.matchReports.length + ')</span></h2>' +
    (matchRows.length
      ? '<div class="table-wrap"><table><thead><tr><th>Role</th><th>Company</th><th>Score</th><th>Band</th>' +
        '<th>Gaps</th><th>Scam signals</th><th>Analysed</th><th></th></tr></thead><tbody>' +
        matchRows.map(function (r) {
          return '<tr><td data-label="Role"><strong>' + esc(r.jobTitle || '—') + '</strong></td>' +
            '<td data-label="Company">' + esc(r.company || '—') + '</td>' +
            '<td data-label="Score"><strong>' + r.score + '</strong>/100</td>' +
            '<td data-label="Band">' + badge(r.bandLabel, r.score >= 80 ? 'green' : r.score >= 60 ? 'blue' : r.score >= 40 ? 'amber' : 'red') + '</td>' +
            '<td data-label="Gaps">' + r.missing.length + '</td>' +
            '<td data-label="Scam signals">' + (r.suspicious.length ? badge(String(r.suspicious.length), 'red') : '0') + '</td>' +
            '<td data-label="Analysed">' + esc(relTime(r.createdAt)) + '</td>' +
            '<td class="row-actions"><button type="button" class="btn btn-sm btn-outline" data-action="open-report" data-id="' + esc(r.id) + '">Open</button></td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<p class="muted small">No job matches analysed yet.</p>') +
  '</div>' +
  '<div class="card"><h2>Employer verification report <span class="count">(' + verifyRows.length + ')</span></h2>' +
    (verifyRows.length
      ? '<div class="table-wrap"><table><thead><tr><th>Company</th><th>Status</th><th>Evidence</th>' +
        '<th>Red flags</th><th>Warnings</th><th>Permit</th><th>Fee</th><th>Checked</th></tr></thead><tbody>' +
        verifyRows.map(function (r) {
          return '<tr><td data-label="Company"><strong>' + esc(r.company) + '</strong></td>' +
            '<td data-label="Status">' + verifyBadge(r.status) + '</td>' +
            '<td data-label="Evidence">' + badge(r.evidenceComplete, r.evidenceComplete === 'Yes' ? 'green' : 'amber') + '</td>' +
            '<td data-label="Red flags">' + (r.danger ? badge(String(r.danger), 'red') : '<span class="muted">0</span>') + '</td>' +
            '<td data-label="Warnings">' + (r.warnings ? badge(String(r.warnings), 'amber') : '<span class="muted">0</span>') + '</td>' +
            '<td data-label="Permit">' + permitBadge(r.permit) + '</td>' +
            '<td data-label="Fee">' + badge(r.fee, r.fee === 'None' ? 'green' : r.fee === 'Upfront' ? 'red' : r.fee === 'Deducted' ? 'amber' : 'gray') + '</td>' +
            '<td data-label="Checked">' + esc(fmtDate(r.checked)) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div style="margin-top:12px"><button type="button" class="btn btn-outline btn-sm" data-action="csv-verification">Export verification report</button></div>'
      : '<p class="muted small">No employers recorded yet.</p>') +
  '</div>' +
  '<div class="grid-2">' +
    '<div class="card"><h2>Applications by country</h2>' +
      barList(byCountry.map(function (e) { return { label: e[0], count: e[1] }; }), maxCountry) + '</div>' +
    '<div class="card"><h2>Applications by company</h2>' +
      barList(byCompany.map(function (e) { return { label: e[0], count: e[1] }; }), maxCompany) + '</div>' +
  '</div>' +
  '<div class="card"><h2>Applications by job title</h2>' +
    barList(byTitle.map(function (e) { return { label: e[0], count: e[1] }; }), maxTitle) + '</div>' +
  '<div class="grid-2">' +
    '<div class="card"><h2>Weekly activity <span class="count">(last 8 weeks)</span></h2>' +
      barList(weeks.map(function (w) { return { label: 'Week of ' + w.label, count: w.count }; }), maxWeek) + '</div>' +
    '<div class="card"><h2>Monthly activity <span class="count">(last 6 months)</span></h2>' +
      barList(months, maxMonth) + '</div>' +
  '</div>' +
  '<div class="card"><h2>Audit log <span class="count">(' + (db.audit || []).length + ')</span></h2>' +
    '<p class="small muted">Status changes, submission confirmations, verification and every draft approval are recorded here.</p>' +
    ((db.audit || []).length
      ? '<div class="table-wrap"><table><thead><tr><th>When</th><th>Entity</th><th>Action</th>' +
        '<th>Field</th><th>Change</th><th>Note</th></tr></thead><tbody>' +
        (db.audit || []).slice().sort(function (a, b) { return String(b.ts).localeCompare(String(a.ts)); })
          .slice(0, 80).map(function (a) {
            return '<tr><td data-label="When">' + esc(fmtDateTime(a.ts)) + '</td>' +
              '<td data-label="Entity">' + esc(a.entity || 'application') + '</td>' +
              '<td data-label="Action">' + esc(a.action) + '</td>' +
              '<td data-label="Field">' + esc(a.field || '—') + '</td>' +
              '<td data-label="Change">' + (a.from || a.to ? esc(a.from || '—') + ' → ' + esc(a.to || '—') : '—') + '</td>' +
              '<td data-label="Note">' + esc(a.note || '') + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
        '<div style="margin-top:12px"><button type="button" class="btn btn-outline btn-sm" data-action="csv-audit">Export audit log</button></div>'
      : '<p class="muted small">No audit entries yet.</p>') +
  '</div>';
}

/* ---------------------------------------------------------
   29. Filter handling
   --------------------------------------------------------- */
function refreshList(page) {
  const sel = { leads:'#leadsList', applications:'#applicationsList', interviews:'#interviewsList',
                employers:'#employersList', documents:'#documentsList' }[page];
  if (!sel) return;
  const el = $(sel);
  if (!el) return;
  const fn = LIST_RENDERERS[page];
  if (fn) el.innerHTML = fn();
}

function onFilterChange(e) {
  const el = e.target.closest('[data-filter]');
  if (!el) return;
  const parts = el.dataset.filter.split('.');
  const page = parts[0], field = parts[1];
  if (!ui[page] || !(field in ui[page])) return;
  if (ui[page][field] === el.value) return;
  ui[page][field] = el.value;
  refreshList(page);
}

function onPrepFieldInput(e) {
  const el = e.target.closest('[data-prep-field]');
  if (!el) return;
  ui.prepare.form[el.dataset.prepField] = el.value;
}

/* ---------------------------------------------------------
   30. Action handler
   --------------------------------------------------------- */
document.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id || '';

  switch (action) {
    case 'goto-prepare':
      ui.page = 'prepare';
      location.hash = '#/prepare';
      render();
      break;
    case 'goto-documents':
      ui.page = 'documents';
      location.hash = '#/documents';
      render();
      break;
    case 'prep-tab':
      ui.prepare.tab = btn.dataset.tab || 'match';
      render();
      break;
    case 'prep-goto-match':
      ui.prepare.tab = 'match';
      render();
      break;

    case 'run-match': runMatch(); break;
    case 'clear-match-form':
      ui.prepare.form = { jobTitle:'', company:'', jobDescription:'', applicationId:'', leadId:'' };
      ui.prepare.lastReportId = '';
      render();
      break;
    case 'open-report':
      ui.prepare.tab = 'match';
      ui.prepare.lastReportId = id;
      if (pageFromHash() !== 'prepare') {
        location.hash = '#/prepare';
      } else {
        ui.page = 'prepare';
        render();
      }
      break;
    case 'match-app': {
      const a = findById(db.applications, id);
      if (!a) break;
      ui.prepare.tab = 'match';
      ui.prepare.form.jobTitle = a.jobTitle || '';
      ui.prepare.form.company = a.company || '';
      ui.prepare.form.applicationId = a.id;
      ui.prepare.form.jobDescription = a.notes || '';
      ui.prepare.lastReportId = '';
      ui.page = 'prepare';
      location.hash = '#/prepare';
      render();
      toast('Paste the full job advert, then run the analysis.', 'success');
      break;
    }
    case 'match-lead': {
      const l = findById(db.leads, id);
      if (!l) break;
      ui.prepare.tab = 'match';
      ui.prepare.form.jobTitle = l.jobTitle || '';
      ui.prepare.form.company = l.company || '';
      ui.prepare.form.leadId = l.id;
      ui.prepare.form.jobDescription = l.notes || '';
      ui.prepare.lastReportId = '';
      ui.page = 'prepare';
      location.hash = '#/prepare';
      render();
      toast('Paste the full job advert, then run the analysis.', 'success');
      break;
    }
    case 'draft-from-report': {
      const type = btn.dataset.type;
      const report = findById(db.matchReports, id);
      if (!report) { toast('That analysis no longer exists.', 'error'); break; }
      ui.prepare.lastReportId = report.id;
      draftFromReport(report.id, type);
      break;
    }
    case 'open-draft':
      if (ui.page !== 'prepare') { ui.page = 'prepare'; ui.prepare.tab = 'drafts'; render(); }
      openDraftEditor(id);
      break;
    case 'approve-draft':
      if (approveDraft(id)) render();
      break;
    case 'mark-draft-sent': markDraftSent(id); break;
    case 'copy-draft': copyDraftToClipboard(id); break;
    case 'delete-draft': deleteDraft(id); break;
    case 'draft-filter':
      ui.prepare.draftFilter = btn.dataset.status || 'All';
      render();
      break;
    case 'new-blank-draft': {
      const d = createDraft({ type: 'coverLetter', title: 'Untitled draft', body: '', provider: 'template' });
      render();
      openDraftEditor(d.id);
      break;
    }
    case 'show-draft-prompt': {
      const d = findById(db.aiDrafts, id);
      if (!d) break;
      const report = d.reportId ? findById(db.matchReports, d.reportId) : null;
      const prompt = buildAIPrompt(
        d.type === 'interviewPrep' ? 'interviewPrep' :
        d.type === 'recruiterEmail' ? 'recruiterEmail' :
        d.type === 'followUp' ? 'followUp' : 'coverLetter',
        {
          company: report ? report.company : (d.title || ''),
          jobTitle: report ? report.jobTitle : '',
          jobDescription: report ? report.jobDescription : '',
          report: report, subtype: d.subtype
        }
      );
      openPromptModal({
        title: 'Prompt for this draft',
        prompt: prompt,
        onImport: function (text) {
          updateDraft(d.id, { body: text, provider: 'ai', model: 'pasted from external AI', status: 'Draft' });
          auditLog({ entity:'draft', entityId: d.id, action:'Draft body imported from external AI', note: d.title });
          saveDB();
          render();
          openDraftEditor(d.id);
          toast('Draft created from pasted text. Review it before approving.', 'success');
        }
      });
      break;
    }
    case 'improve-draft-ai': improveDraftWithAI(id); break;
    case 'generate-interview': {
      const sel = $('#ivApp');
      if (!sel || !sel.value) { toast('Select an application first.', 'error'); break; }
      generateInterviewForApp(sel.value);
      break;
    }
    case 'run-check': {
      const el = $('#chkText');
      if (!el) break;
      ui.prepare.checkText = el.value;
      if (!el.value.trim()) { toast('Paste a message first.', 'error'); break; }
      render();
      const found = scanSuspiciousClaims(el.value);
      toast(found.length ? found.length + ' signal(s) found.' : 'No suspicious patterns found.',
            found.length ? 'error' : 'success');
      break;
    }
    case 'clear-check':
      ui.prepare.checkText = '';
      render();
      break;

    case 'edit-profile': openProfileEditor(); break;
    case 'copy-profile-json':
      copyText(profileJson(db.settings.experienceProfile)).then(function (ok) {
        toast(ok ? 'Profile JSON copied.' : 'Copy failed.', ok ? 'success' : 'error');
      });
      break;
    case 'save-ai-config': saveAIConfig(); break;
    case 'test-ai': testAIConnection(); break;
    case 'clear-ai-key':
      runtime.aiKey = '';
      db.settings.ai.apiKey = '';
      saveDB();
      render();
      toast('API key forgotten.', 'success');
      break;

    case 'new-lead': leadForm(null); break;
    case 'edit-lead': {
      const l = findById(db.leads, id);
      if (l) leadForm(l);
      break;
    }
    case 'delete-lead': {
      const l = findById(db.leads, id);
      if (l) deleteRecord('leads', id, l.company + ' — ' + l.jobTitle);
      break;
    }
    case 'convert-lead': {
      const l = findById(db.leads, id);
      if (!l) break;
      applicationForm(null, {
        company: l.company, jobTitle: l.jobTitle, country: l.country, city: l.city,
        vacancyUrl: l.vacancyUrl, workPermitSupport: l.workPermitSupport,
        salaryExpectation: l.salary ? (l.salary + ' ' + (l.currency || '')).trim() : '',
        notes: l.notes, status: 'Ready to Apply', applicationDate: todayISO(),
        __fromLeadId: l.id
      });
      break;
    }

    case 'new-application': applicationForm(null); break;
    case 'edit-application': {
      const a = findById(db.applications, id);
      if (a) applicationForm(a);
      break;
    }
    case 'delete-application': {
      const a = findById(db.applications, id);
      if (!a) break;
      deleteRecord('applications', id, a.company + ' — ' + a.jobTitle, function () {
        db.followups    = db.followups.filter(function (f) { return f.applicationId !== id; });
        db.aiDrafts     = db.aiDrafts.filter(function (d) { return d.applicationId !== id; });
        db.matchReports = db.matchReports.filter(function (r) { return r.applicationId !== id; });
      });
      break;
    }
    case 'open-workflow': openWorkflowModal(id); break;

    case 'wf-check-permit': wfCheckPermit(id); break;
    case 'wf-mark-ready': wfMarkReady(id); break;
    case 'wf-select-docs': wfSelectDocs(id); break;
    case 'wf-confirm-submit': wfConfirmSubmit(id); break;
    case 'wf-set-date': wfSetDate(id); break;
    case 'wf-schedule-followup': wfScheduleFollowup(id); break;
    case 'wf-record-response': wfRecordResponse(id); break;
    case 'wf-add-interview': wfAddInterview(id); break;
    case 'wf-evaluate-offer': wfEvaluateOffer(id); break;
    case 'wf-verify-auth': wfVerifyAuth(id); break;
    case 'wf-close-app': wfCloseApp(id); break;
    case 'wf-open-employer': {
      const app = findById(db.applications, id);
      if (!app) break;
      const emp = findEmployerForApp(app);
      if (emp) employerForm(emp);
      else employerForm(null, { legalName: app.company, country: app.country || 'Poland' });
      break;
    }
    case 'wf-add-employer': {
      const app = findById(db.applications, id);
      if (!app) break;
      employerForm(null, { legalName: app.company, country: app.country || 'Poland' });
      break;
    }

    case 'log-followup': followupForm(); break;
    case 'log-followup-for': {
      const a = findById(db.applications, id);
      if (!a) { followupForm(); break; }
      followupForm(a.id);
      break;
    }
    case 'draft-followup-for': {
      const a = findById(db.applications, id);
      if (!a) break;
      const diff = a.applicationDate ? daysBetween(a.applicationDate, todayISO()) : 7;
      const built = buildFollowUp({ company: a.company, jobTitle: a.jobTitle,
        recruiterName: a.recruiterName || '', days: Math.max(1, diff) });
      const d = createDraft({
        type: 'followUp', title: 'Follow-up — ' + a.company,
        subject: built.subject, body: built.body,
        applicationId: a.id, provider: 'template',
        facts: profileFactLines(db.settings.experienceProfile).slice(0, 4)
      });
      render();
      openDraftEditor(d.id);
      break;
    }
    case 'delete-followup': {
      const f = findById(db.followups, id);
      if (!f) break;
      deleteRecord('followups', id, 'follow-up from ' + fmtDate(f.date));
      break;
    }

    case 'new-interview': interviewForm(null); break;
    case 'edit-interview': {
      const i = findById(db.interviews, id);
      if (i) interviewForm(i);
      break;
    }
    case 'delete-interview': {
      const i = findById(db.interviews, id);
      if (!i) break;
      deleteRecord('interviews', id, (i.employer || '') + ' — ' + fmtDate(i.date));
      break;
    }

    case 'new-employer': employerForm(null); break;
    case 'open-employer': openEmployerModal(id); break;
    case 'edit-employer': {
      const em = findById(db.employers, id);
      if (em) employerForm(em);
      break;
    }
    case 'delete-employer': {
      const em = findById(db.employers, id);
      if (!em) break;
      deleteRecord('employers', id, em.legalName);
      break;
    }

    case 'new-document': documentForm(null); break;
    case 'edit-document': {
      const d = findById(db.documents, id);
      if (d) documentForm(d);
      break;
    }
    case 'delete-document': {
      const d = findById(db.documents, id);
      if (!d) break;
      deleteRecord('documents', id, d.filename);
      break;
    }

    case 'save-settings': saveSettings(); break;
    case 'download-json': downloadBackup(); break;
    case 'restore-json': triggerRestore(); break;
    case 'clear-all': clearAllData(); break;
    case 'load-demo': loadDemoData(); break;
    case 'remove-demo': removeDemoData(); break;

    case 'export-apps-csv': exportApplicationsCSV(); break;
    case 'export-leads-csv': exportLeadsCSV(); break;
    case 'export-employers-csv': exportEmployersCSV(); break;
    case 'csv-verification': exportVerificationCSV(); break;
    case 'csv-audit': exportAuditCSV(); break;

    case 'quick-add-lead': leadForm(null); break;
    case 'quick-add-application': applicationForm(null); break;
    case 'quick-add-interview': interviewForm(null); break;
    case 'quick-add-employer': employerForm(null); break;
    case 'quick-add-document': documentForm(null); break;
    case 'quick-add-followup': followupForm(); break;

    default: break;
  }
});

        return String(v || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      };
      const roles = String(data.rolesText || '').split('\n').map(function (line) {
        const parts = line.split('|').map(function (s) { return s.trim(); });
        if (!parts[0]) return null;
        return { title: parts[0] || '', employer: parts[1] || '', country: parts[2] || '', years: parts[3] || '' };

      closeModal();
      render();

function saveAIConfig() {
  const provider = $('#aiProvider') ? $('#aiProvider').value : 'none';
  const model = $('#aiModel') ? $('#aiModel').value.trim() : '';
  const baseUrl = $('#aiBase') ? $('#aiBase').value.trim() : '';
  const key = $('#aiKey') ? $('#aiKey').value.trim() : '';
  const remember = $('#aiRemember') ? $('#aiRemember').checked : false;

  if (provider !== 'none') {
    if (!model) { toast('Enter a model name.', 'error'); return; }
    if (!/^https?:\/\//i.test(baseUrl)) { toast('The base URL must start with http:// or https://', 'error'); return; }
    if (!key) { toast('Enter an API key, or set the provider to None.', 'error'); return; }
  }

  db.settings.ai = {
    provider: provider, model: model,
    baseUrl: baseUrl || 'https://api.openai.com/v1',
    apiKey: remember ? key : '',
    rememberKey: remember
  };
  if (remember) runtime.aiKey = '';
  else runtime.aiKey = key;

  auditLog({ entity:'settings', entityId:'ai', action:'AI settings changed',
    to: provider === 'none' ? 'Templates only' : (model || 'configured'),
    note: remember ? 'Key remembered on this device' : 'Key kept in memory only' });
  saveDB();
  render();
  toast('AI settings saved.', 'success');
}

async function testAIConnection() {
  if (!aiConfigured()) { toast('Save a provider, model and API key first.', 'error'); return; }
  openModal({ title: 'Testing connection…',

  downloadFile('jobtrack-backup-' + todayISO() + '.json', JSON.stringify(payload, null, 2), 'application/json');

function triggerRestore() {
  const input = $('#restoreInput');
  if (!input) return;
  input.value = '';
  input.onchange = function () {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      let parsed = null;
      try { parsed = JSON.parse(String(reader.result)); }
      catch (err) { toast('That file is not valid JSON.', 'error'); return; }

      const dataPart = parsed && parsed.data ? parsed.data : parsed;
      if (!dataPart || typeof dataPart !== 'object' ||
          (!Array.isArray(dataPart.leads) && !Array.isArray(dataPart.applications))) {
        toast('This does not look like a JobTrack backup file.', 'error');
        return;
      }
      const counts = {
        leads: Array.isArray(dataPart.leads) ? dataPart.leads.length : 0,
        applications: Array.isArray(dataPart.applications) ? dataPart.applications.length : 0,
        employers: Array.isArray(dataPart.employers) ? dataPart.employers.length : 0
      };
      confirmDialog({
        title: 'Restore backup',
        message: 'This will replace all current data with the backup (' + counts.leads + ' leads, ' +
          counts.applications + ' applications, ' + counts.employers + ' employers). Continue?',
        confirmLabel: 'Restore',
        onConfirm: function () {
          db = normalizeDB(dataPart);
          saveDB();
          render();
          toast('Backup restored.', 'success');
        }
      });
    };
    reader.onerror = function () { toast('Could not read that file.', 'error'); };
    reader.readAsText(file);
  };
  input.click();
}

function openWorkflowModal(appId) {
  const app = findById(db.applications, appId);
  if (!app) return;

  const wf = workflowProgress(app);
  const pctDone = Math.round((wf.done / wf.total) * 100);
  const emp = findEmployerForApp(app);
  const empDanger = emp ? employerWarnings(emp).filter(function (w) { return w.level === 'danger'; }) : [];

  const drafts = linkedDrafts(app.id);
  const pendingDrafts = drafts.filter(function (d) { return d.status === 'Draft'; });

  const stepsHtml = wf.steps.map(function (s) {
    let actions = '';
    if (s.actionName) {
      const labelMap = {
        'edit-application':'Open', 'wf-open-employer':'Verify employer', 'wf-add-employer':'Add employer',
        'wf-check-permit':'Record check', 'wf-mark-ready':'Mark ready', 'wf-select-docs':'Select docs',
        'wf-confirm-submit':'Confirm submission', 'wf-set-date':'Set date', 'wf-schedule-followup':'Schedule',
        'wf-record-response':'Record response', 'wf-add-interview':'Schedule interview',
        'wf-evaluate-offer':'Evaluate offer', 'wf-verify-auth':'Verify authorization', 'wf-close-app':'Close application'
      };
      actions = '<button type="button" class="btn btn-sm btn-primary" data-action="' + esc(s.actionName) +
        '" data-id="' + esc(app.id) + '">' + esc(labelMap[s.actionName] || 'Open') + '</button>';
    }
    return '<div class="wf-step ' + (s.done ? 'done' : 'todo') + '">' +
      '<div class="wf-num">' + (s.done ? '✓' : s.n) + '</div>' +
      '<div class="wf-body"><div class="wf-label">' + esc(s.label) + '</div>' +
        (s.detail ? '<div class="wf-detail muted">' + esc(s.detail) + '</div>' : '') + '</div>' +
      (actions ? '<div class="wf-actions">' + actions + '</div>' : '') + '</div>';
  }).join('');

  const draftsHtml = drafts.length
    ? '<ul class="list-plain">' + drafts.map(function (d) {
        return '<li><span class="li-main"><strong>' + esc(DRAFT_TYPES[d.type].label) + '</strong> — ' +
          esc(d.title) + '<div class="small muted">' + esc(relTime(d.updatedAt)) + '</div></span>' +
          '<span class="li-meta">' + draftStatusBadge(d.status) +
          ' <button type="button" class="btn btn-sm btn-outline" data-action="open-draft" data-id="' + esc(d.id) + '">Open</button>' +
          '</span></li>';
      }).join('') + '</ul>'
    : '<p class="muted small">No prepared content linked to this application.</p>';

  const audit = (db.audit || []).filter(function (a) { return a.entityId === appId; })
    .sort(function (a, b) { return String(b.ts).localeCompare(String(a.ts)); })
    .slice(0, 40);

  const auditHtml = audit.length
    ? '<ul class="list-plain">' + audit.map(function (a) {
        const parts = [];
        if (a.from || a.to) parts.push(esc(a.from || '—') + ' → ' + esc(a.to || '—'));
        return '<li><span class="li-main"><strong>' + esc(a.action) + '</strong>' +
          (a.field ? ' · <em>' + esc(a.field) + '</em>' : '') +
          (parts.length ? '<div class="small muted">' + parts.join(' · ') + '</div>' : '') +
          (a.note ? '<div class="small muted">' + esc(a.note) + '</div>' : '') +
          '</span><span class="li-meta">' + esc(relTime(a.ts)) + '</span></li>';
      }).join('') + '</ul>'
    : '<p class="muted small">No audit history for this application yet.</p>';

  const empWarnHtml = emp
    ? '<hr><h3 style="font-size:14px;margin:0 0 8px">Employer warnings — ' + esc(emp.legalName) + '</h3>' +
      warningsHtml(emp, 4) +
      '<button type="button" class="btn btn-outline btn-sm" data-action="open-employer" data-id="' + esc(emp.id) + '">Open employer check</button>'
    : '';

  openModal({
    title: 'Workflow — ' + app.company,
    wide: true,
    body:
      '<div class="notice ' + (empDanger.length ? 'danger' : '') + '">' +
        '<div class="grow"><strong>' + esc(app.company) + '</strong> — ' + esc(app.jobTitle) +
          '<div class="small muted" style="margin-top:4px">Status: ' + statusBadge(app.status) + '</div>' +
          '<div class="wf-progress"><span>' + wf.done + ' / ' + wf.total + ' steps</span>' +
            '<span class="wf-progress-track"><span class="wf-progress-fill" style="width:' + pctDone + '%"></span></span>' +
            '<span>' + pctDone + '%</span></div></div></div>' +
      (empDanger.length
        ? '<div class="notice danger"><div class="grow"><strong>' + empDanger.length +
          ' employer red flag(s) on this application.</strong> Review the employer check before proceeding.</div></div>' : '') +
      (pendingDrafts.length
        ? '<div class="notice warn"><div class="grow"><strong>' + pendingDrafts.length +
          ' draft(s) not yet approved.</strong> Submission is blocked until each draft is approved or discarded.</div></div>' : '') +
      '<div class="wf-list">' + stepsHtml + '</div>' +
      '<hr><h3 style="font-size:14px;margin:0 0 8px">Prepared content <span class="muted">(' + drafts.length + ')</span></h3>' +
      draftsHtml +
      '<div style="margin-top:8px"><button type="button" class="btn btn-purple btn-sm" data-action="match-app" data-id="' +
      esc(app.id) + '">Open AI Prep</button></div>' +
      empWarnHtml +
      '<hr><h3 style="font-size:14px;margin-bottom:8px">Audit history</h3>' + auditHtml,
    footer: '<button type="button" class="btn btn-outline" data-close>Close</button>' +
            '<button type="button" class="btn btn-primary" data-action="edit-application" data-id="' +
            esc(app.id) + '">Edit application</button>'
  });
}

function wfMarkReady(appId) {
  const app = findById(db.applications, appId);
  if (!app) return;
  const emp = findEmployerForApp(app);
  const warnings = [];
  if (!isEmployerVerified(emp)) warnings.push('Employer is not fully verified with evidence.');
  if (!(app.workPermitSupport && app.workPermitSupport !== 'Unknown' && app.workPermitCheckedAt)) {
    warnings.push('Work-permit eligibility has not been checked.');
  }
  if (!app.cvVersion || !app.coverLetterVersion) warnings.push('CV or cover letter version not selected.');
  if (emp) {
    const danger = employerWarnings(emp).filter(function (w) { return w.level === 'danger'; });
    if (danger.length) warnings.push(danger.length + ' employer red flag(s) unresolved.');
  }

  confirmDialog({
    title: 'Mark Ready to Apply',
    message: warnings.length
      ? 'Not all prerequisites are complete:\n• ' + warnings.join('\n• ') + '\n\nContinue anyway? JobTrack requires this manual confirmation.'
      : 'Mark this application Ready to Apply?',
    confirmLabel: 'Mark ready', danger: false,
    onConfirm: function () {
      const old = app.status;
      app.status = 'Ready to Apply';
      app.readyToApplyAt = new Date().toISOString();
      app.updatedAt = new Date().toISOString();
      auditLog({ entityId: app.id, action:'Status changed', field:'status', from: old, to:'Ready to Apply' });
      saveDB();
      render();
      toast('Application marked Ready to Apply.', 'success');
    }
  });
}

function wfConfirmSubmit(appId) {
  const app = findById(db.applications, appId);
  if (!app) return;

  function bodyHtml() {
    const drafts = linkedDrafts(app.id);
    const pending = drafts.filter(function (d) { return d.status === 'Draft'; });

    const draftsBlock = drafts.length
      ? '<hr><h3 style="font-size:14px;margin:0 0 8px">Prepared content <span class="muted">(' +
        drafts.length + ')</span></h3>' +
        (pending.length
          ? '<div class="notice danger"><div class="grow"><strong>Approve or discard these drafts before submitting.</strong> ' +
            'You asked JobTrack to require your approval before any communication is used.</div></div>'
          : '<div class="notice"><div class="grow">All linked drafts are approved or discarded.</div></div>') +
        '<ul class="list-plain">' + drafts.map(function (d) {
          return '<li><span class="li-main"><strong>' + esc(DRAFT_TYPES[d.type].label) + '</strong> — ' +
            esc(d.title) + '</span><span class="li-meta">' + draftStatusBadge(d.status) +
            (d.status === 'Draft'
              ? ' <button type="button" class="btn btn-sm btn-outline" data-approve-in-modal="' + esc(d.id) + '">Approve</button>' +
                ' <button type="button" class="btn btn-sm btn-outline" data-discard-in-modal="' + esc(d.id) + '">Discard</button>'
              : ' <button type="button" class="btn btn-sm btn-outline" data-action="open-draft" data-id="' + esc(d.id) + '">Open</button>') +
            '</span></li>';
        }).join('') + '</ul>'
      : '';

    return '<div class="notice warn"><div class="grow"><strong>Manual confirmation required.</strong> ' +
        'JobTrack never submits applications for you. Only tick this if you have personally submitted this ' +
        'application through the employer\'s or recruiter\'s official channel.</div></div>' +
      '<div class="field"><label for="wfSubDate">Submission date <span class="req">*</span></label>' +
      '<input id="wfSubDate" type="date" value="' + esc(app.applicationDate || todayISO()) + '">' +
      '<p class="err" id="wfSubDateErr" hidden></p></div>' +
      '<div class="field" style="margin-top:12px"><label for="wfSubMethod">Application method</label>' +
      '<select id="wfSubMethod">' + optionsHtml(METHODS, app.applicationMethod || '', 'Select…') + '</select></div>' +
      '<div class="field" style="margin-top:12px"><label for="wfSubNotes">Submission notes (optional)</label>' +
      '<textarea id="wfSubNotes" rows="2" placeholder="e.g. Submitted via the employer portal, confirmation email received"></textarea></div>' +
      draftsBlock +
      '<div class="field" style="margin-top:12px"><label class="checkline"><input type="checkbox" id="wfSubCheck"> ' +
      '<span>I confirm I personally submitted this application through the official channel.</span></label>' +
      '<p class="err" id="wfSubErr" hidden></p></div>';
  }

  function footerHtml() {
    const pending = unapprovedDrafts(app.id);
    return '<button class="btn btn-outline" data-close>Cancel</button>' +
      '<button class="btn btn-primary" id="wfSubSave"' + (pending.length ? ' disabled' : '') + '>' +
      (pending.length ? 'Approve drafts first' : 'Confirm submission') + '</button>';
  }

  openModal({
    title: 'Confirm submission — ' + app.company,
    body: bodyHtml(),
    footer: footerHtml(),
    onMount: function (modal) {
      function wire() {
        const cb = $('#wfSubCheck', modal);
        const dateInput = $('#wfSubDate', modal);
        const btn = $('#wfSubSave', modal);
        if (!cb || !dateInput || !btn) return;

        function update() {
          const stillPending = unapprovedDrafts(app.id).length > 0;
          btn.disabled = !cb.checked || !dateInput.value || stillPending;
        }
        cb.addEventListener('change', update);
        dateInput.addEventListener('input', update);
        update();

        btn.addEventListener('click', function () {
          if (unapprovedDrafts(app.id).length) {
            toast('Approve or discard every linked draft before submitting.', 'error');
            return;
          }
          if (!cb.checked) {
            const e = $('#wfSubErr', modal); e.textContent = 'You must tick the confirmation.'; e.hidden = false; return;
          }
          if (!dateInput.value) {
            const e = $('#wfSubDateErr', modal); e.textContent = 'Submission date is required.'; e.hidden = false; return;
          }
          const oldStatus = app.status;
          app.applicationDate = dateInput.value;
          app.submittedConfirmedAt = new Date().toISOString();
          if ($('#wfSubMethod', modal).value) app.applicationMethod = $('#wfSubMethod', modal).value;
          if (!app.followUpDate) app.followUpDate = addDaysISO(app.applicationDate, 7);
          if (oldStatus === 'Draft' || oldStatus === 'Ready to Apply') app.status = 'Applied';
          app.updatedAt = new Date().toISOString();
          auditLog({ entityId: app.id, action:'Submission manually confirmed',
            note:'Submission date ' + app.applicationDate });
          if (oldStatus !== app.status) {
            auditLog({ entityId: app.id, action:'Status changed', field:'status', from: oldStatus, to: app.status });
          }
          if (app.followUpDate) {
            auditLog({ entityId: app.id, action:'Follow-up date set', field:'followUpDate', to: app.followUpDate });
          }
          const notes = $('#wfSubNotes', modal).value.trim();
          if (notes) auditLog({ entityId: app.id, action:'Submission note', note: notes });
          saveDB();
          closeModal();
          render();
          toast('Submission confirmed.', 'success');
        });
      }

      function refresh() {
        const cb = $('#wfSubCheck', modal);
        const dateEl = $('#wfSubDate', modal);
        const methodEl = $('#wfSubMethod', modal);
        const notesEl = $('#wfSubNotes', modal);
        const saved = {
          checkbox: cb ? cb.checked : false,
          date: dateEl ? dateEl.value : '',
          method: methodEl ? methodEl.value : '',
          notes: notesEl ? notesEl.value : ''
        };
        $('.modal-body', modal).innerHTML = bodyHtml();
        const footer = $('.modal footer', modal);
        if (footer) footer.innerHTML = footerHtml();
        if (saved.date)  { const el = $('#wfSubDate', modal);   if (el) el.value = saved.date; }
        if (saved.checkbox) { const el = $('#wfSubCheck', modal); if (el) el.checked = true; }
        if (saved.method) { const el = $('#wfSubMethod', modal); if (el) el.value = saved.method; }
        if (saved.notes)  { const el = $('#wfSubNotes', modal);  if (el) el.value = saved.notes; }
        wire();
        bindInline();
      }

      function bindInline() {
        $$('[data-approve-in-modal]', modal).forEach(function (b) {
          b.addEventListener('click', function () {
            if (approveDraft(b.dataset.approveInModal, true)) {
              toast('Draft approved.', 'success');
              refresh();
            }
          });
        });
        $$('[data-discard-in-modal]', modal).forEach(function (b) {
          b.addEventListener('click', function () {
            const d = findById(db.aiDrafts, b.dataset.discardInModal);
            if (!d) return;
            d.status = 'Discarded';
            d.updatedAt = new Date().toISOString();
            auditLog({ entity:'draft', entityId: d.id, action:'Draft discarded', note: d.title });
            saveDB();
            toast('Draft discarded.', 'success');
            refresh();
          });
        });
      }

      wire();
      bindInline();
    }
  });
}

function checkStorageAvailability() {
  try {
    const k = '__jobtrack_test__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch (e) { return false; }
}

function init() {
  if (!checkStorageAvailability()) {
    $('#main').innerHTML =
      '<div class="notice warn" style="margin-top:20px"><div class="grow">' +
      '<strong>LocalStorage is not available.</strong> JobTrack needs browser storage to work. ' +
      'Check that you are not in a private window with storage disabled.</div></div>';
    return;
  }

  db = loadDB();
  if (!db) {
    db = freshDB();
    seedDemo(db);
    saveDB();
  }

  if (db.settings.ai && db.settings.ai.rememberKey) {
    runtime.aiKey = String(db.settings.ai.apiKey || '');
  }

  buildNav();
  ui.page = pageFromHash();
  render();

  $('#menuBtn').addEventListener('click', function () {
    if ($('#sidenav').classList.contains('open')) closeNav();
    else openNav();
  });
  $('#scrim').addEventListener('click', closeNav);
  $('#quickAddBtn').addEventListener('click', openQuickAdd);

  window.addEventListener('hashchange', function () {
    ui.page = pageFromHash();
    render();
  });

  const main = $('#main');
  main.addEventListener('input', function (e) { onFilterChange(e); onPrepFieldInput(e); });
  main.addEventListener('change', onFilterChange);
}

document.addEventListener('DOMContentLoaded', init);

})();
</script>
